<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="Tres cosas distintas —el texto del agente, tus propios datos y un segundo modelo— viajan a la vez por un mismo canal hasta la pantalla">
  <!--
    Un solo canal, tres cosas viajando dentro a la vez. Con un protocolo propio
    cada una era inventar más protocolo; aquí las tres se mezclan en el mismo
    stream y llegan intercaladas a la pantalla.

    Flat vector con la paleta de la casa, igual que accion-tres-superficies.
    La animación es CSS dentro del propio SVG, no SMIL ni JS: así sigue viva
    cuando el archivo se usa como <img>, que es como lo referencia el markdown
    de las descripciones. Sutil a propósito —va al lado de un video.
  -->
  <style>
    .caja    { fill: #122027; stroke: #85DDCB; stroke-width: 2.5; }
    .destino { fill: #16232b; stroke: #FFC46B; stroke-width: 3; }
    .txt     { fill: #E8F1EF; font: bold 14px Helvetica, Arial, sans-serif; }
    .txtf    { fill: #FFD79A; font: bold 16px Helvetica, Arial, sans-serif; }
    .sub     { fill: #8FA5A9; font: 11.5px Helvetica, Arial, sans-serif; }
    .pared   { stroke: #2f4550; stroke-width: 3; fill: none; stroke-linecap: round; }
    .guia    { stroke: #2f4550; stroke-width: 2; fill: none; opacity: .55; }

    /* Cada hilo entra por su boca y sigue por el tubo, desfasado del resto:
       por eso se ven mezclados dentro del canal en vez de en fila. */
    .hilo { stroke-width: 4; fill: none; stroke-linecap: round;
            stroke-dasharray: 30 470; }
    .h1 { stroke: #FFC46B; animation: correr 5s linear infinite; }
    .h2 { stroke: #85DDCB; animation: correr 5s linear infinite; animation-delay: 1.1s; }
    .h3 { stroke: #7FB2FF; animation: correr 5s linear infinite; animation-delay: 2.3s; }
    @keyframes correr { to { stroke-dashoffset: -500; } }

    /* La pantalla parpadea cada vez que le llega algo, tres veces por vuelta. */
    .destino { animation: recibir 5s ease-in-out infinite; }
    @keyframes recibir {
      0%, 14%, 34%, 54%, 74%, 100% { stroke: #FFC46B; }
      22%, 42%, 62%                { stroke: #FFE0AA; }
    }

    /* Las tres líneas que se pintan dentro de la pantalla, una por hilo. */
    .linea { stroke-width: 5; stroke-linecap: round; stroke-dasharray: 0 130;
             animation: escribir 5s ease-out infinite; }
    .l1 { stroke: #FFC46B; }
    .l2 { stroke: #85DDCB; animation-delay: 1.1s; }
    .l3 { stroke: #7FB2FF; animation-delay: 2.3s; }
    @keyframes escribir {
      0%, 30%   { stroke-dasharray: 0 130; }
      52%, 92%  { stroke-dasharray: 108 130; }
      100%      { stroke-dasharray: 0 130; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hilo, .destino, .linea { animation: none; }
      .hilo { display: none; }
      .linea { stroke-dasharray: 108 130; }
    }
  </style>

  <!-- Las tres fuentes -->
  <rect class="caja" x="10" y="10" width="196" height="56" rx="12" />
  <text class="txt" x="108" y="34" text-anchor="middle">El texto del agente</text>
  <text class="sub" x="108" y="52" text-anchor="middle">y su razonamiento</text>

  <rect class="caja" x="10" y="92" width="196" height="56" rx="12" />
  <text class="txt" x="108" y="116" text-anchor="middle">Tus propios datos</text>
  <text class="sub" x="108" y="134" text-anchor="middle">para pintar tu interfaz</text>

  <rect class="caja" x="10" y="174" width="196" height="56" rx="12" />
  <text class="txt" x="108" y="198" text-anchor="middle">Un segundo modelo</text>
  <text class="sub" x="108" y="216" text-anchor="middle">describiendo en paralelo</text>

  <!-- Las bocas: cada fuente baja o sube hasta la entrada del tubo -->
  <path class="guia" d="M206 38 H244 Q262 38 262 62 V104" />
  <path class="guia" d="M206 120 H262" />
  <path class="guia" d="M206 202 H244 Q262 202 262 178 V136" />

  <!-- El canal: dos paredes y nada más. Lo que importa es lo que va dentro. -->
  <path class="pared" d="M262 100 H452" />
  <path class="pared" d="M262 140 H452" />
  <text class="sub" x="357" y="163" text-anchor="middle">un solo canal</text>

  <!-- Los tres hilos, cada uno entra por su boca y sigue por el mismo tubo -->
  <path class="hilo h1" d="M206 38 H244 Q262 38 262 62 V112 Q262 120 274 120 H452" />
  <path class="hilo h2" d="M206 120 H452" />
  <path class="hilo h3" d="M206 202 H244 Q262 202 262 178 V128 Q262 120 274 120 H452" />

  <!-- La pantalla, donde llegan mezclados -->
  <rect class="destino" x="452" y="52" width="176" height="136" rx="14" />
  <text class="txtf" x="540" y="78" text-anchor="middle">La pantalla</text>
  <path class="linea l1" d="M478 106 H586" />
  <path class="linea l2" d="M478 132 H586" />
  <path class="linea l3" d="M478 158 H586" />
</svg>
