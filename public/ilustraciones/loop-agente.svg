<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="El ciclo de un agente: el modelo pide una herramienta, tu código la ejecuta, el resultado vuelve al historial">
  <!--
    El ciclo del agente. Flat vector con la paleta de la casa.

    La animación es CSS dentro del propio SVG, no SMIL ni JS: así sigue viva
    cuando el archivo se usa como <img>, que es como lo referencia el markdown
    de las descripciones. Es deliberadamente sutil —un pulso que recorre el
    camino— porque va al lado de un video: si compite por la atención, estorba.
  -->
  <style>
    .caja  { fill: #122027; stroke: #85DDCB; stroke-width: 2.5; }
    .txt   { fill: #E8F1EF; font: bold 16px Helvetica, Arial, sans-serif; }
    .sub   { fill: #8FA5A9; font: 12.5px Helvetica, Arial, sans-serif; }
    .linea { stroke: #85DDCB; stroke-width: 2.5; fill: none; }
    .vuelta{ stroke: #FFC46B; stroke-width: 2.5; fill: none; opacity: .55; }

    /* el pulso recorre el circuito y vuelve a empezar donde empezó */
    .pulso { stroke: #85DDCB; stroke-width: 3.5; fill: none; stroke-linecap: round;
             stroke-dasharray: 46 1200; animation: correr 7s linear infinite; }
    @keyframes correr { to { stroke-dashoffset: -1246; } }

    /* cada caja respira cuando el pulso pasa por ella */
    .b1 { animation: latir 7s ease-in-out infinite; }
    .b2 { animation: latir 7s ease-in-out infinite; animation-delay: 1.2s; }
    .b3 { animation: latir 7s ease-in-out infinite; animation-delay: 2.4s; }
    @keyframes latir {
      0%, 8%, 22%, 100% { stroke: #85DDCB; }
      12%, 18%          { stroke: #FFC46B; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulso, .b1, .b2, .b3 { animation: none; }
      .pulso { display: none; }
    }
  </style>
  <defs>
    <marker id="p" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0l8 4L0 8z" fill="#85DDCB" />
    </marker>
  </defs>

  <rect class="caja b1" x="14" y="40" width="170" height="70" rx="12" />
  <text class="txt" x="99" y="72" text-anchor="middle">El modelo</text>
  <text class="sub" x="99" y="92" text-anchor="middle">pide una herramienta</text>

  <rect class="caja b2" x="235" y="40" width="170" height="70" rx="12" />
  <text class="txt" x="320" y="72" text-anchor="middle">Tu código</text>
  <text class="sub" x="320" y="92" text-anchor="middle">la ejecuta</text>

  <rect class="caja b3" x="456" y="40" width="170" height="70" rx="12" />
  <text class="txt" x="541" y="72" text-anchor="middle">El resultado</text>
  <text class="sub" x="541" y="92" text-anchor="middle">vuelve al historial</text>

  <path class="linea" d="M188 75h42" marker-end="url(#p)" />
  <path class="linea" d="M409 75h42" marker-end="url(#p)" />
  <path class="vuelta" d="M541 114v42H99v-42" />

  <!-- el mismo camino, recorrido por el pulso -->
  <path class="pulso" d="M188 75h42M409 75h42M541 114v42H99v-42" />

  <text class="sub" x="320" y="178" text-anchor="middle" fill="#FFC46B">
    y se le vuelve a llamar, con todo lo anterior
  </text>
</svg>
