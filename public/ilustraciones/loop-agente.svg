<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="El ciclo de un agente: modelo, herramienta, resultado y de vuelta al modelo">
  <!-- El ciclo del agente dibujado como lo que es: tres cajas y una flecha que
       regresa. Flat vector con la paleta de la casa, sin gradientes. -->
  <style>
    .caja { fill: #122027; stroke: #85DDCB; stroke-width: 3; }
    .txt  { fill: #E8F1EF; font: bold 17px Helvetica, Arial, sans-serif; }
    .sub  { fill: #8FA5A9; font: 13px Helvetica, Arial, sans-serif; }
    .flecha { stroke: #85DDCB; stroke-width: 3; fill: none; }
    .vuelta { stroke: #FFC46B; stroke-width: 3; fill: none; stroke-dasharray: 7 6; }
  </style>
  <defs>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0l9 4.5L0 9z" fill="#85DDCB" />
    </marker>
    <marker id="p2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0l9 4.5L0 9z" fill="#FFC46B" />
    </marker>
  </defs>

  <rect class="caja" x="16" y="46" width="170" height="72" rx="12" />
  <text class="txt" x="101" y="80" text-anchor="middle">El modelo</text>
  <text class="sub" x="101" y="100" text-anchor="middle">pide una herramienta</text>

  <rect class="caja" x="236" y="46" width="170" height="72" rx="12" />
  <text class="txt" x="321" y="80" text-anchor="middle">Tu código</text>
  <text class="sub" x="321" y="100" text-anchor="middle">la ejecuta</text>

  <rect class="caja" x="456" y="46" width="170" height="72" rx="12" />
  <text class="txt" x="541" y="80" text-anchor="middle">El resultado</text>
  <text class="sub" x="541" y="100" text-anchor="middle">vuelve al historial</text>

  <path class="flecha" d="M190 82h40" marker-end="url(#p)" />
  <path class="flecha" d="M410 82h40" marker-end="url(#p)" />

  <path class="vuelta" d="M541 122v46H101v-46" marker-end="url(#p2)" />
  <text class="sub" x="321" y="190" text-anchor="middle" fill="#FFC46B">
    y se vuelve a llamar al modelo, con todo lo anterior
  </text>
</svg>
