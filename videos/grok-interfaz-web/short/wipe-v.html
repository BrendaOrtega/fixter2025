<!doctype html>
<html><head><meta charset="UTF-8">
<style>
  /* Transición propia del short, distinta a la del corte de YouTube: aquí las
     columnas CAEN, que es el gesto del formato vertical. Cada columna arranca
     con un retraso distinto, así el barrido cruza en diagonal y no como una
     cortina lisa. El estado se pinta según ?t= (0 a 1), y el render captura
     cuadro por cuadro: nada de animación en el tiempo del navegador, que no es
     reproducible. */
  html,body{margin:0;background:transparent;overflow:hidden}
  #c{position:relative;width:1080px;height:1920px;overflow:hidden}
  .col{position:absolute;top:0;width:calc(1080px/6);height:1920px}
  .seg{position:absolute;left:0;width:100%;height:calc(1920px/8)}
</style></head><body><div id="c"></div>
<script>
  const t = parseFloat(new URLSearchParams(location.search).get("t") || "0");
  const COLS = 6, FILAS = 8, c = document.getElementById("c");
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  for (let i = 0; i < COLS; i++) {
    const col = document.createElement("div");
    col.className = "col";
    col.style.left = `calc(1080px/6*${i})`;
    // El retraso por columna es lo que hace la diagonal.
    const retraso = (i / COLS) * 0.45;
    const p = Math.max(0, Math.min(1, (t - retraso) / (1 - 0.45)));
    const avance = easeOut(p);
    for (let j = 0; j < FILAS; j++) {
      const s = document.createElement("div");
      s.className = "seg";
      s.style.top = `calc(1920px/8*${j})`;
      const d = i + j;
      s.style.background = d % 5 === 0 ? "#fbbf24" : d % 3 === 1 ? "#17121f" : "#7c3aed";
      // Cada segmento cae desde arriba y se detiene en su sitio.
      const y = (1 - avance) * -(1920 / 8) * (j + 1.6);
      s.style.transform = `translateY(${y}px)`;
      s.style.opacity = avance > 0 ? 1 : 0;
      col.appendChild(s);
    }
    c.appendChild(col);
  }
</script></body></html>
