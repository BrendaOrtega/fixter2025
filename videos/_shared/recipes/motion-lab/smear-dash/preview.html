    <script>
      // Parámetros: TODO lo que cambia entre usos vive aquí
      const PARAMS = {
        palette: "fixtergeek",       // "fixtergeek" | "easybits"
        fps: 30,                     // la fps del render: los cuadros de smear se ponen en n/fps exactos
        groundY: 540,
        park: 280,                   // x donde arranca estacionado
        // cada «dash» = anticipación + cuadros a mano + frenón con overshoot (bucle finito: una entrada por elemento)
        // frames[i] = { x, sx (estirado), sk (skewX°), ghosts: [x previos] }; el último cuadro es el frenón
        dashes: [
          { at: 24, from: 280, frames: [ { x: 440, sx: 1.9, sk: 8, ghosts: [280, 360] }, { x: 760, sx: 2.2, sk: 6, ghosts: [440, 600] },
            { x: 935, sx: 1.3, sk: 0, ghosts: [760] }, { x: 978, sx: 1, sk: -16, ghosts: [] } ], rest: 960 },
          { at: 62, from: 960, frames: [ { x: 1120, sx: 2.0, sk: 8, ghosts: [960, 1040] }, { x: 1450, sx: 2.4, sk: 6, ghosts: [1120, 1290] },
            { x: 1800, sx: 1, sk: 0, ghosts: [1450] }, { x: 1900, sx: 1, sk: 0, ghosts: [] } ], rest: null },
          { at: 80, from: -340, frames: [ { x: 60, sx: 2.2, sk: 8, ghosts: [-140] }, { x: 420, sx: 1.8, sk: 6, ghosts: [60, 240] },
            { x: 610, sx: 1.2, sk: 0, ghosts: [420] }, { x: 656, sx: 1, sk: -16, ghosts: [] } ], rest: 640 },
        ],
        anticip: { frames: 6, sx: 0.9, sk: 12 }, // agacharse hacia atrás antes de arrancar
        settle: { duration: 0.45, s: 3 },        // frenón: back.out(s) de vuelta a skew 0
        ghostOpacity: [0.55, 0.3],                // la copia más cercana primero
        label: true,
      };
      const PALETTES = {
        fixtergeek: { bg: "#0E1317", ink: "#F2F5F4", accent: "#85DDCB", accent2: "#8DCF6E", muted: "#7C8A8E" },
        easybits:   { bg: "#0b0b0f", ink: "#ffffff", accent: "#7c3aed", accent2: "#fbbf24", muted: "#8a8a99" },
      };
      const P = PALETTES[PARAMS.palette];
      const root = document.getElementById("root");
      for (const k of ["bg", "ink", "accent", "accent2", "muted"]) root.style.setProperty("--" + k, P[k]);
      const DUR = parseFloat(root.dataset.duration);
      const NS = "http://www.w3.org/2000/svg";
      const add = (parent, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const G = PARAMS.groundY;
      document.getElementById("road").setAttribute("y", G - 44);
      document.getElementById("actor").setAttribute("transform", `translate(0 ${G})`);
      for (let x = 70; x < 1240; x += 150) add(document.getElementById("lane"), "rect", { x, y: G + 44, width: 80, height: 12, rx: 6, fill: P.bg });
      // utilería de fondo: postes con letrero (no se mueven: la cámara está fija)
      const props = document.getElementById("props");
      // misma gramática que el coche, a peso de entorno: silueta unida poste + letrero (5.5 px), sombra --muted, flecha de pincel
      const SIGN = { pole: { x: -6, y: 330, width: 12, height: 180, rx: 4 }, board: { x: -46, y: 270, width: 92, height: 64, rx: 12 } };
      [[200, 0], [620, 1], [1080, 0]].forEach(([x, k]) => {
        const post = add(props, "g", { transform: `translate(${x} 0)` });
        const sil = (g) => { add(g, "rect", SIGN.pole); add(g, "rect", SIGN.board); return g; };
        sil(add(post, "g", { transform: "translate(8 8)", fill: P.muted, stroke: P.muted, "stroke-width": 11, "stroke-linejoin": "round" }));
        sil(add(post, "g", { fill: P.bg, stroke: P.bg, "stroke-width": 11, "stroke-linejoin": "round" }));
        add(post, "rect", { ...SIGN.pole, fill: P.ink });
        add(post, "rect", { ...SIGN.board, fill: k ? P.accent2 : P.accent });
        add(post, "use", { href: "#signArrow", transform: "translate(0 302)", fill: P.bg });
      });
      document.getElementById("pillText").textContent = "smear de 1–2 cuadros + múltiplos · sin blur";
      document.getElementById("pill").style.display = PARAMS.label ? "" : "none";

      const ghosts = [...document.querySelectorAll(".ghost")];
      const F = 1 / PARAMS.fps;
      const at = (f) => Math.max(0, f * F - 0.004); // un poco antes del cuadro f para que el seek del render lo agarre
      const tl = gsap.timeline({ paused: true });
      // pose de un cuadro (a mano): posición, smear, múltiplos y líneas
      const pose = (f, { x, sx = 1, sk = 0, ghosts: gx = [] }) => {
        const t = at(f);
        tl.set("#carPos", { x }, t).set("#carBody", { scaleX: sx, skewX: sk }, t)
          .set("#speed", { opacity: sx > 1.5 ? 1 : 0 }, t);
        ghosts.forEach((g, i) => tl.set(g, { x: gx[i] ?? x, opacity: gx[i] == null ? 0 : PARAMS.ghostOpacity[i] }, t));
      };
      // estado inicial
      tl.set("#carBody", { svgOrigin: "120 0", scaleX: 1, skewX: 0, y: 0 }, 0)
        .set(["#wheelA", "#wheelB"], { rotation: 0 }, 0)
        .set("#wheelA", { svgOrigin: "-70 -26" }, 0).set("#wheelB", { svgOrigin: "70 -26" }, 0);
      pose(0, { x: PARAMS.park });
      // motor en ralentí: tiembla poquito antes del primer arranque (bucle finito)
      tl.to("#carBody", { y: -3, duration: 0.08, ease: "power1.inOut", yoyo: true, repeat: 5 }, 0.1);

      const cues = [];
      let spin = 0; // giro acumulado de las ruedas (valor absoluto: seek-safe)
      PARAMS.dashes.forEach((d) => {
        const a = PARAMS.anticip, f0 = d.at - a.frames;
        if (d.from !== d.frames[0].x) pose(f0, { x: d.from });
        // anticipación: se agacha hacia atrás (sólo si arranca en cuadro)
        if (d.from > 0 && d.from < 1280) tl.to("#carBody", { scaleX: a.sx, skewX: a.sk, duration: a.frames * F, ease: "power2.in" }, at(f0));
        d.frames.forEach((fr, i) => pose(d.at + 1 + i, fr));
        const fEnd = d.at + d.frames.length;
        // ruedas: giran durante el tramo rápido
        spin += 540;
        tl.to(["#wheelA", "#wheelB"], { rotation: spin, duration: d.frames.length * F, ease: "none" }, at(d.at + 1));
        cues.push({ t: +(at(d.at + 1) + 0.004).toFixed(3), sfx: "whoosh" });
        if (d.rest != null) { // frenón: overshoot de posición y skew, se asienta con back.out(s)
          const s = PARAMS.settle.s;
          tl.to("#carPos", { x: d.rest, duration: PARAMS.settle.duration, ease: `back.out(${s})` }, at(fEnd) + 0.001)
            .to("#carBody", { skewX: 0, duration: PARAMS.settle.duration, ease: `back.out(${s})` }, at(fEnd) + 0.001);
          cues.push({ t: +(at(fEnd) + 0.004).toFixed(3), sfx: "screech" });
          cues.push({ t: +(at(fEnd) + 0.004 + PARAMS.settle.duration / (s + 1)).toFixed(3), sfx: "clunk" });
        }
      });
      window.__sfxCues = cues;
      tl.to({}, { duration: 0.001 }, DUR - 0.001);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
