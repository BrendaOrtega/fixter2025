<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>motion-lab — iso-bars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0E1317; }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); font-family: Inter, system-ui, sans-serif; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "Geist Mono", monospace; }
      #stage { position: absolute; left: 0; top: 0; overflow: visible; }
      #plate { fill: var(--panel); stroke: var(--muted); stroke-width: 2; }
      #floor line { stroke: var(--muted); stroke-width: 1; opacity: 0.55; }
      #bars polygon { stroke: var(--bg); stroke-width: 1.2; stroke-linejoin: round; }
      #title { position: absolute; left: 60px; top: 70px; width: 420px; font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; color: var(--ink); }
      #kicker { position: absolute; left: 60px; top: 36px; font-size: 18px; letter-spacing: 0.12em; color: var(--muted); }
      #legend { position: absolute; left: 60px; bottom: 60px; color: var(--muted); font-size: 18px; letter-spacing: 0.06em; }
      #legend .steps { display: flex; gap: 4px; margin: 10px 0; }
      #legend .steps div { width: 28px; height: 16px; border-radius: 3px; }
      #legend .ends { display: flex; justify-content: space-between; width: 316px; }
      #callout { position: absolute; left: 60px; top: 230px; border: 2px solid var(--accent2); color: var(--accent2); font-size: 20px; letter-spacing: 0.06em; padding: 10px 16px; border-radius: 4px; white-space: nowrap; }
      #callout .ch { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-duration="5">
      <div id="kicker" class="mono"></div>
      <div id="title"></div>
      <div id="callout" class="mono"></div>
      <div id="legend" class="mono"><div id="legend-title"></div><div class="steps"></div><div class="ends"><span id="legend-lo"></span><span id="legend-hi"></span></div></div>
      <svg id="stage" width="1280" height="720" viewBox="0 0 1280 720">
        <g id="cam">
          <polygon id="plate" />
          <g id="floor"></g>
          <g id="bars"></g>
        </g>
      </svg>
    </div>

    <script>
      // Parámetros: TODO lo que cambia entre usos vive aquí
      const PARAMS = {
        palette: "fixtergeek",     // "fixtergeek" | "easybits"
        // valores 0–1 por celda: alto y tono de cada cubo (filas × columnas). null = generado con la semilla
        values: null,
        rows: 8, cols: 8,          // sólo si values es null
        seed: 3,
        cube: { w: 40, h: 20, gap: 6, maxHeight: 220, minHeight: 8 }, // w/h = medio ancho y medio alto del rombo; gap = canal entre cubos
        origin: { x: 850, y: 250 },// vértice superior de la cuadrícula en el lienzo
        kicker: "SESIÓN 5 · MEMORIA",
        title: ["Conversaciones", "por agente"],
        callout: "pico: agente 12", // etiqueta ámbar que aparece al final ("" = ninguna)
        legend: { title: "TURNOS POR SESIÓN", lo: "0", hi: "240", steps: 8 },
        timings: {
          stage: 0.2,              // la cuadrícula entra escalando
          grow: 0.5,               // arrancan a crecer los cubos (del centro hacia afuera)
          growDur: 0.7,            // duración del crecimiento de cada cubo
          legend: 1.0,
          zoom: 2.6,               // la cámara se acerca al pico
          callout: 3.2,
          total: 5,
        },
      };
      const PALETTES = {
        fixtergeek: { bg: "#0E1317", ink: "#F2F5F4", accent: "#85DDCB", accent2: "#8DCF6E", muted: "#7C8A8E", panel: "#16202A", low: "#2E4A4A" },
        easybits:   { bg: "#0b0b0f", ink: "#ffffff", accent: "#7c3aed", accent2: "#fbbf24", muted: "#8a8a99", panel: "#15131f", low: "#2b2450" },
      };
      const root = document.getElementById("root");
      const PAL = PALETTES[PARAMS.palette];
      for (const k in PAL) root.style.setProperty("--" + k, PAL[k]);
      document.body.style.background = PAL.bg;
      root.dataset.duration = PARAMS.timings.total;

      // PRNG con semilla fija
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(PARAMS.seed);
      const SVG = "http://www.w3.org/2000/svg";
      const T = PARAMS.timings;

      // valores: los dados, o un montículo con ruido centrado en la cuadrícula
      let values = PARAMS.values;
      if (!values) {
        values = [];
        for (let i = 0; i < PARAMS.rows; i++) {
          const row = [];
          for (let j = 0; j < PARAMS.cols; j++) {
            const dx = i - (PARAMS.rows - 1) / 2, dy = j - (PARAMS.cols - 1) / 2;
            row.push(Math.max(0, Math.min(1, 1.15 - Math.sqrt(dx * dx + dy * dy) / (PARAMS.rows * 0.55) + (rand() - 0.5) * 0.2)));
          }
          values.push(row);
        }
      }
      const ROWS = values.length, COLS = values[0].length;

      // color por valor: interpolación plana entre `low` y `accent` (sin gradientes en pantalla: cada cara es un color sólido)
      function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
      function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; }
      function shade(rgb, f) { const m = rgb.match(/\d+/g).map(Number); return `rgb(${m.map((v) => Math.round(v * f)).join(",")})`; }
      function tone(v) { return mix(PAL.low, PAL.accent, v); }

      // textos
      document.getElementById("kicker").textContent = PARAMS.kicker;
      document.getElementById("title").innerHTML = PARAMS.title.map((l) => `<div>${l}</div>`).join("");
      document.getElementById("legend-title").textContent = PARAMS.legend.title;
      document.getElementById("legend-lo").textContent = PARAMS.legend.lo;
      document.getElementById("legend-hi").textContent = PARAMS.legend.hi;
      const steps = document.querySelector("#legend .steps");
      for (let k = 0; k < PARAMS.legend.steps; k++) { const d = document.createElement("div"); d.style.background = tone(k / (PARAMS.legend.steps - 1)); steps.appendChild(d); }
      const calloutEl = document.getElementById("callout");
      const calloutChars = [...PARAMS.callout].map((c) => { const s = document.createElement("span"); s.className = "ch"; s.innerHTML = c === " " ? "&nbsp;" : c; calloutEl.appendChild(s); return s; });

      // ---- cuadrícula isométrica plana: placa + líneas + cubos de tres caras ----
      const { w: W, h: H, gap, maxHeight, minHeight } = PARAMS.cube;
      const OX = PARAMS.origin.x, OY = PARAMS.origin.y;
      const TW = W - gap / 2, TH = TW * H / W; // medio ancho/alto del rombo del cubo, con canal
      const iso = (i, j) => [OX + (i - j) * W, OY + (i + j) * H];
      // placa
      const pad = 26;
      const [ax, ay] = iso(0, 0), [bx, by] = iso(COLS, 0), [cx2, cy2] = iso(COLS, ROWS), [dx2, dy2] = iso(0, ROWS);
      document.getElementById("plate").setAttribute("points", `${ax},${ay - pad * 0.6} ${bx + pad},${by} ${cx2},${cy2 + pad * 0.6} ${dx2 - pad},${dy2}`);
      // líneas de la cuadrícula
      const floor = document.getElementById("floor");
      const line = (p, q) => { const l = document.createElementNS(SVG, "line"); l.setAttribute("x1", p[0]); l.setAttribute("y1", p[1]); l.setAttribute("x2", q[0]); l.setAttribute("y2", q[1]); floor.appendChild(l); };
      for (let i = 0; i <= COLS; i++) line(iso(i, 0), iso(i, ROWS));
      for (let j = 0; j <= ROWS; j++) line(iso(0, j), iso(COLS, j));
      // cubos, pintados de atrás hacia adelante
      const bars = document.getElementById("bars");
      const cubes = [];
      const order = [];
      for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++) order.push({ i, j });
      order.sort((a, b) => (a.i + a.j) - (b.i + b.j));
      let peak = null;
      order.forEach(({ i, j }) => {
        const v = values[j][i];
        const [bx0, by0] = iso(i + 0.5, j + 0.5);
        const top = tone(v), left = shade(top, 0.72), right = shade(top, 0.5);
        const g = document.createElementNS(SVG, "g");
        const mk = (fill) => { const p = document.createElementNS(SVG, "polygon"); p.setAttribute("fill", fill); g.appendChild(p); return p; };
        const pl = mk(left), pr = mk(right), pt = mk(top);
        bars.appendChild(g);
        const cube = { bx: bx0, by: by0, h: minHeight, target: minHeight + v * (maxHeight - minHeight), pl, pr, pt, i, j, v };
        cube.draw = () => {
          const { bx, by, h } = cube;
          pt.setAttribute("points", `${bx},${by - TH - h} ${bx + TW},${by - h} ${bx},${by + TH - h} ${bx - TW},${by - h}`);
          pl.setAttribute("points", `${bx - TW},${by} ${bx},${by + TH} ${bx},${by + TH - h} ${bx - TW},${by - h}`);
          pr.setAttribute("points", `${bx},${by + TH} ${bx + TW},${by} ${bx + TW},${by - h} ${bx},${by + TH - h}`);
        };
        cube.draw(); // cuadro 0: cubos bajos, ya visibles
        cubes.push(cube);
        if (!peak || v > peak.v) peak = cube;
      });

      const tl = gsap.timeline({ paused: true });
      const centerX = OX, centerY = OY + ROWS * H; // centro de la placa
      // la cuadrícula entra escalando desde un tamaño visible
      tl.fromTo("#stage", { scale: 0.6 }, { scale: 1, duration: 0.6, ease: "power3.out", transformOrigin: `${centerX}px ${centerY}px` }, T.stage);
      // crecen del centro hacia afuera
      cubes.forEach((cb) => {
        const dist = Math.abs(cb.i - (COLS - 1) / 2) + Math.abs(cb.j - (ROWS - 1) / 2);
        tl.to(cb, { h: cb.target, duration: T.growDur, ease: "power2.out", onUpdate: cb.draw }, T.grow + dist * 0.045);
      });
      tl.fromTo("#legend", { y: 20, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, T.legend);
      // la cámara se acerca al pico (svgOrigin, nunca transformOrigin dentro del svg)
      tl.set("#cam", { svgOrigin: `${peak.bx} ${peak.by - peak.target / 2}` }, 0);
      tl.to("#cam", { scale: 1.45, duration: 0.9, ease: "power2.inOut" }, T.zoom);
      tl.to("#legend", { opacity: 0, duration: 0.2 }, T.zoom);
      // etiqueta ámbar en typewriter
      tl.set("#callout", { autoAlpha: 0 }, 0);
      if (PARAMS.callout) {
        tl.to("#callout", { autoAlpha: 1, duration: 0.15 }, T.callout);
        calloutChars.forEach((c, k) => tl.set(c, { visibility: "visible" }, T.callout + 0.1 + k * 0.03));
      }
      tl.set({}, {}, T.total);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
