<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; }
      #root { position: absolute; inset: 0; background: var(--bg); font-family: Inter, system-ui, sans-serif; color: var(--ink); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      /* la capa de dither: SVG a pantalla completa, va debajo de todo lo demás */
      #dither { position: absolute; inset: 0; width: 1280px; height: 720px; }
      /* contenido de ejemplo encima de la capa (se reemplaza por el de la escena) */
      #card { position: absolute; left: 340px; top: 240px; width: 600px; height: 240px; background: var(--bg); border: 3px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      #card .title { font-size: 72px; font-weight: 600; letter-spacing: -3px; }
      #card .sub { font-family: "Geist Mono", ui-monospace, monospace; font-size: 24px; color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1280" data-height="720">
      <div class="clip" data-start="0" data-duration="4">
        <svg id="dither" viewBox="0 0 1280 720"><defs id="defs"></defs><g id="blobs"></g></svg>
        <div id="card"><div class="title">Ghosty</div><div class="sub">agente en caja</div></div>
      </div>
    </div>
    <script>
      // Parámetros: TODO lo que cambia entre usos vive aquí
      const PARAMS = {
        palette: "fixtergeek",                 // "fixtergeek" | "easybits"
        mode: "dots",                          // "dots" = puntos con tamaño por distancia | "noise" = feTurbulence + umbral
        corners: ["tl", "br", "tr"],           // nombres ("tl","tr","bl","br") o {x, y, radius}
        radius: 320,                           // radio de la mancha (px) para las esquinas por nombre
        density: 0.6,                          // 0..1: cobertura máxima en el centro de la mancha (>0.7 se ve sólido)
        bands: 6,                              // anillos cuantizados (más = degradado más fino, sigue siendo plano)
        cell: 8,                               // paso de la trama de puntos (px) en modo "dots"
        seed: 20260917,                        // semilla del PRNG (jitter de radios) y de feTurbulence
        tint: "ink",                           // color de los puntos: "ink" | "accent" | "accent2" | "muted" | "#hex"
        opacity: 0.9,                          // opacidad de la capa
        reveal: { enabled: true, duration: 0.6, stagger: 0.12, ease: "back.out(1.4)" }, // las manchas crecen al inicio
        holdFrame0: true,                      // fotograma 0 completo: la capa ya está y el reveal se ve como pulso
      };
      const PALETTES = {
        fixtergeek: { bg: "#0E1317", ink: "#F2F5F4", accent: "#85DDCB", accent2: "#8DCF6E", muted: "#7C8A8E" },
        easybits:   { bg: "#0b0b0f", ink: "#ffffff", accent: "#7c3aed", accent2: "#fbbf24", muted: "#8a8a99" },
      };
      const P = PALETTES[PARAMS.palette];
      const root = document.getElementById("root");
      for (const k of ["bg", "ink", "accent", "accent2", "muted"]) root.style.setProperty("--" + k, P[k]);
      const tint = P[PARAMS.tint] || PARAMS.tint;

      // PRNG determinista (mulberry32)
      let s = PARAMS.seed | 0;
      const rnd = () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

      // esquinas por nombre → centro un poco fuera del lienzo para que la mancha muerda la esquina
      const NAMED = { tl: [-40, -40], tr: [1320, -40], bl: [-40, 760], br: [1320, 760] };
      const corners = PARAMS.corners.map((c) => typeof c === "string" ? { x: NAMED[c][0], y: NAMED[c][1], radius: PARAMS.radius } : c);

      const SVG = "http://www.w3.org/2000/svg";
      const el = (n, a) => { const e = document.createElementNS(SVG, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
      const defs = document.getElementById("defs"), blobs = document.getElementById("blobs");
      const svg = document.getElementById("dither");
      svg.style.opacity = PARAMS.opacity;

      // por banda k (0 = centro, más denso): un patrón de puntos o un filtro de umbral
      const B = PARAMS.bands;
      for (let k = 0; k < B; k++) {
        const cover = PARAMS.density * Math.pow(1 - k / B, 1.5); // cobertura de esta banda (área de punto / área de celda); curva para que no se pegue al centro
        if (PARAMS.mode === "dots") {
          const r = Math.sqrt(cover / Math.PI) * PARAMS.cell; // radio del punto que da esa cobertura
          const pat = el("pattern", { id: "dot" + k, width: PARAMS.cell, height: PARAMS.cell, patternUnits: "userSpaceOnUse" }); // sin rotar: girar la trama produce moiré contra la rejilla de píxeles
          pat.appendChild(el("circle", { cx: PARAMS.cell / 2, cy: PARAMS.cell / 2, r: r.toFixed(2), fill: tint }));
          defs.appendChild(pat);
        } else {
          // ruido fino + umbral discreto sobre la luminancia: sólo pasan los píxeles por encima del umbral (sin degradado)
          const f = el("filter", { id: "noise" + k, x: 0, y: 0, width: 1, height: 1, "color-interpolation-filters": "sRGB" });
          f.appendChild(el("feTurbulence", { type: "fractalNoise", baseFrequency: 0.9, numOctaves: 1, seed: PARAMS.seed % 1000 + k, result: "n" }));
          f.appendChild(el("feColorMatrix", { in: "n", type: "luminanceToAlpha", result: "lum" }));
          // calibrado en Chrome: cobertura ≈ 0.5 − 4·(umbral − 0.5)  →  umbral = 0.625 − cobertura/4
          const th = Math.min(0.62, Math.max(0.36, 0.625 - cover / 4));
          const ct = el("feComponentTransfer", { in: "lum", result: "mask" });
          ct.appendChild(el("feFuncA", { type: "discrete", tableValues: Array.from({ length: 64 }, (_, i) => (i / 64 >= th ? 1 : 0)).join(" ") }));
          f.appendChild(ct);
          f.appendChild(el("feFlood", { "flood-color": tint, result: "c" }));
          f.appendChild(el("feComposite", { in: "c", in2: "mask", operator: "in" }));
          defs.appendChild(f);
        }
      }

      // cada mancha: anillos concéntricos del más grande (menos denso) al más chico (más denso)
      const groups = corners.map((c, i) => {
        const g = el("g", { class: "blob" });
        for (let k = B - 1; k >= 0; k--) {
          const rr = c.radius * ((k + 1) / B) * (1 + (rnd() - 0.5) * 0.12); // banda 0 = anillo más chico y más denso; radio con jitter
          const cid = `clip${i}_${k}`;
          const cp = el("clipPath", { id: cid }); cp.appendChild(el("circle", { cx: c.x, cy: c.y, r: rr.toFixed(1) })); defs.appendChild(cp);
          const rect = el("rect", { x: c.x - rr, y: c.y - rr, width: rr * 2, height: rr * 2, "clip-path": `url(#${cid})` });
          if (PARAMS.mode === "dots") rect.setAttribute("fill", `url(#dot${k})`);
          else { rect.setAttribute("fill", "#fff"); rect.setAttribute("filter", `url(#noise${k})`); }
          g.appendChild(rect);
        }
        blobs.appendChild(g);
        return { g, c };
      });

      const tl = gsap.timeline({ paused: true });
      const R = PARAMS.reveal;
      if (R.enabled) {
        // con holdFrame0 la mancha arranca completa y hace un pulso (0.7 → 1); sin él, crece desde 0
        groups.forEach(({ g, c }, i) => {
          tl.fromTo(g, { scale: PARAMS.holdFrame0 ? 0.7 : 0, svgOrigin: `${c.x} ${c.y}` }, { scale: 1, duration: R.duration, ease: R.ease, immediateRender: true }, i * R.stagger);
        });
      }
      tl.to({}, { duration: 0.001 }, parseFloat(root.dataset.duration) - 0.001);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
