<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>motion-lab — hourglass-lines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: var(--bg, #0E1317); }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
      svg { display: block; }
      text { font-family: Inter, system-ui, sans-serif; fill: var(--ink); }
      .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
      .box { stroke: var(--muted); stroke-width: 1.5; fill: var(--bg); }
      .wire { stroke: var(--muted); stroke-width: 1.2; fill: none; }
      .live { stroke: var(--accent); stroke-width: 1.6; fill: none; }
      .pulse { stroke: var(--ink); stroke-width: 1.6; fill: none; }
      .sq { stroke: var(--muted); stroke-width: 1.2; fill: var(--bg); }
      .glyph { font-family: "Geist Mono", ui-monospace, monospace; font-size: 96px; fill: var(--accent2); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-duration="3.5">
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720">
        <defs>
          <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.2" fill="var(--muted)" opacity="0.5" /></pattern>
        </defs>
        <rect x="420" y="130" width="440" height="460" fill="url(#dots)" />
        <g id="wires"></g>
        <g id="lives"></g>
        <g id="squares"></g>
        <g id="pulses"></g>
        <g id="lab-top">
          <rect x="525" y="132" width="230" height="70" class="thin" />
          <path d="M525,202 L605,320 M755,202 L675,320" class="thin" id="funnel-top" />
          <path d="M739,140 h8 v8 M533,194 v-8 h-8" class="thin" />
          <text id="txt-top" x="640" y="180" font-size="34" text-anchor="middle"></text>
        </g>
        <g id="lab-bot">
          <rect x="525" y="520" width="230" height="66" class="thin" />
          <path d="M525,520 L605,390 M755,520 L675,390" class="thin" id="funnel-bot" />
          <path d="M739,528 h8 v8 M533,578 v-8 h-8" class="thin" />
          <text id="txt-bot" x="640" y="566" font-size="34" text-anchor="middle"></text>
        </g>
        <g id="center">
          <rect x="580" y="294" width="120" height="120" class="box" />
          <path d="M688,300 h6 v6 M592,408 v6 h-6" class="thin" />
          <text id="glyph" class="glyph" x="640" y="388" text-anchor="middle"></text>
        </g>
      </svg>
    </div>

    <script>
      // Parámetros: TODO lo que cambia entre usos vive aquí
      const PARAMS = {
        palette: "fixtergeek",              // "fixtergeek" | "easybits"
        count: 16,                          // curvas por lado
        seed: 11,                           // semilla del PRNG (posiciones, pulsos, cuadritos)
        labels: { top: "Posibilidades", bottom: "Aplicaciones" },
        glyph: "λ",                         // carácter grande al centro (un carácter o palabra corta)
        timings: {
          centerIn: 0.45,                   // el centro entra con rebote
          draw: 0.9,                        // trazo de las curvas (todas, con stagger)
          drawStagger: 0.02,                // separación entre curvas
          pulseAt: 1.3,                     // cuándo empiezan los pulsos
          pulseDur: 0.9,                    // duración de cada pulso
        },
        duration: 3.5,
      };
      const PALETTES = {
        fixtergeek: { bg: "#0E1317", ink: "#F2F5F4", accent: "#85DDCB", accent2: "#8DCF6E", muted: "#7C8A8E" },
        easybits:   { bg: "#0b0b0f", ink: "#ffffff", accent: "#7c3aed", accent2: "#fbbf24", muted: "#8a8a99" },
      };
      const root = document.getElementById("root");
      const pal = PALETTES[PARAMS.palette];
      for (const k in pal) root.style.setProperty("--" + k, pal[k]);
      document.documentElement.style.setProperty("--bg", pal.bg);
      root.dataset.duration = PARAMS.duration;

      // PRNG con semilla fija (mulberry32)
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(PARAMS.seed);
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };
      const $ = (id) => document.getElementById(id);

      $("txt-top").textContent = PARAMS.labels.top;
      $("txt-bot").textContent = PARAMS.labels.bottom;
      $("glyph").textContent = PARAMS.glyph;

      // --- decenas de curvas que entran por los lados y convergen al centro ---
      // la pista gris está completa desde el cuadro 0; encima se dibuja la viva en color
      const lives = [], squares = [], pulses = [];
      const step = 560 / PARAMS.count;
      for (let side = 0; side < 2; side++) {
        const left = side === 0;
        for (let i = 0; i < PARAMS.count; i++) {
          const y0 = 70 + i * step + rnd() * 20;
          const x0 = left ? -20 + rnd() * 120 : 1300 - rnd() * 120;
          const ye = 330 + rnd() * 48;
          const xe = left ? 580 : 700;
          const xm = left ? 430 + rnd() * 60 : 850 - rnd() * 60;
          const d = `M${x0},${y0} C${xm - (left ? 120 : -120)},${y0} ${xm},${ye} ${xe},${ye}`;
          const track = el("path", { d, class: "wire" }, $("wires"));
          lives.push(el("path", { d, class: "live" }, $("lives")));
          if (rnd() < 0.5) pulses.push(el("path", { d, class: "pulse" }, $("pulses")));
          // cuadritos a lo largo de la curva
          const n = 1 + Math.floor(rnd() * 2);
          for (let s = 0; s < n; s++) {
            const t = 0.15 + rnd() * 0.6;
            const p = track.getPointAtLength(t * track.getTotalLength());
            const sz = 22 + rnd() * 16;
            squares.push(el("rect", { x: p.x - sz / 2, y: p.y - sz / 2, width: sz, height: sz, class: "sq" }, $("squares")));
          }
        }
      }

      // trazo con dashoffset
      lives.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
      // pulsos: segmento corto que recorre la curva
      // el pulso queda apagado hasta que arranca (si no, asoma un trozo en la orilla en el cuadro 0)
      pulses.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = `60 ${L}`; p.style.strokeDashoffset = L + 60; p.style.opacity = 0; });

      const tl = gsap.timeline({ paused: true });
      const T = PARAMS.timings;
      const C = { svgOrigin: "640 354" };

      // el centro y las etiquetas ya están (cuadro 0); entran con un rebote de escala
      gsap.set("#center", { scale: 0.7, ...C });
      gsap.set(["#lab-top", "#lab-bot"], { scale: 0.85, ...C });
      tl.to("#center", { scale: 1, duration: T.centerIn, ease: "back.out(1.4)", ...C }, 0)
        .to(["#lab-top", "#lab-bot"], { scale: 1, duration: T.centerIn, ease: "back.out(1.6)", ...C }, 0.05)
        .to(lives, { strokeDashoffset: 0, duration: T.draw, ease: "power2.inOut", stagger: T.drawStagger }, 0.1)
        .fromTo(squares, { scale: 0.6 }, { scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.01, transformOrigin: "50% 50%", immediateRender: false }, 0.3);
      pulses.forEach((p, i) => {
        const L = p.getTotalLength();
        const at = T.pulseAt + (i % 7) * 0.15;
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: L + 60 }, { strokeDashoffset: -60, duration: T.pulseDur, ease: "power1.inOut" }, at);
        tl.set(p, { opacity: 0 }, at + T.pulseDur);
      });
      tl.to({}, { duration: 0.001 }, PARAMS.duration);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
