    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #f4f5fb; }
      #root { position: absolute; inset: 0; background: var(--bg); font-family: Inter, system-ui, sans-serif; color: var(--ink); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .card { position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 6px 0 var(--soft); }
      #codeCard { left: 64px; top: 236px; width: 372px; height: 212px; padding: 26px 28px; }
      #codeCard .kick { font-family: Poppins, Inter, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
      .code { position: absolute; left: 28px; top: 70px; visibility: hidden; }
      .code b { display: block; font-family: "Geist Mono", ui-monospace, monospace; font-weight: 600; font-size: 30px; color: var(--ink); white-space: nowrap; }
      .code i { display: block; font-style: normal; font-size: 19px; font-weight: 500; color: var(--muted); margin-top: 14px; width: 316px; line-height: 1.35; }
      #listCard { left: 880px; top: 96px; width: 336px; height: 528px; padding: 18px 16px; }
      .row { height: 40.5px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; font-family: "Geist Mono", monospace; font-size: 19px; color: var(--muted); }
      .row .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line2); flex: none; }
      .row[data-s="on"] { background: var(--accent); color: #ffffff; }
      .row[data-s="on"] .dot { border-color: #ffffff; background: #ffffff; }
      .row[data-s="done"] { color: var(--ink); }
      .row[data-s="done"] .dot { border-color: var(--accent); background: var(--accent); }
    </style>
  </head>

    <script>
      // Parámetros: TODO lo que cambia entre usos vive aquí
      const PARAMS = {
        palette: "ghosty",            // "ghosty" (piel de ghosty.studio) | "fixtergeek"
        duration: 6.9,            // = data-duration del HTML
        home: { x: 640, y: 600, s: 1.5 }, // pie de Ghosty (base de los olanes) y escala
        idle: { amp: 7, period: 1.6 },
        badge: ["Agente", "ghosty.studio"], // dos renglones del gafete (capa gBadge)
        // [t, gesto, args, código que se muestra, qué se ve]
        steps: [[0.0, "idle", {}, "rig.idle(0, 6.9)", "flota en reposo; finita, sin repeat:-1"], [0.25, "blink", {}, "rig.blink(t)", "parpadea con el ojo completo"], [0.5, "look", {"dir": "left"}, "rig.look(t, \"left\")", "párpado y pupila se mueven juntos"], [0.8, "look", {"dir": "right"}, "rig.look(t, \"right\")", "mira al otro lado"], [1.1, "look", {"dir": "center"}, "rig.look(t, \"center\")", "vuelve a verte"], [1.3, "wink", {"side": "R", "hold": 0.4}, "rig.wink(t)", "guiño con un ojo"], [1.8, "happy", {"hold": 0.8}, "rig.happy(t).hop(t)", "ojitos felices; se agacha, brinca y aterriza con squash"], [1.8, "hop", {"h": 90, "dur": 0.5}, null, null], [2.5, "accessory", {"id": "gBadge"}, "rig.accessory(\"gBadge\", t)", "el gafete es una capa aparte"], [2.6, "proud", {"hold": 0.85}, "rig.proud(t)", "se infla y mira su gafete"], [3.75, "shy", {"hold": 0.85}, "rig.shy(t)", "se ladea, desvía la mirada y te mira de reojo"], [4.85, "wave", {"dur": 0.6}, "rig.wave(t)", "saluda con el cuerpo (no tiene manos)"], [5.45, "exit", {}, "rig.exit(t)", "se agacha y sale disparado"], [6.0, "enter", {}, "rig.enter(t)", "cae y aterriza con squash"]],
      };
      const PALETTES = {
        ghosty:     { bg: "#f4f5fb", ink: "#191a20", accent: "#8483e0", accent2: "#aeadef", muted: "#6c6f79", card: "#ffffff", line: "#e1e3e7", line2: "#d6d7e6", soft: "#e4e4fa", floor: "#e4e4fa" },
        fixtergeek: { bg: "#0E1317", ink: "#F2F5F4", accent: "#85DDCB", accent2: "#8DCF6E", muted: "#7C8A8E", card: "#161d22", line: "#26313a", line2: "#2c3840", soft: "#0a0e11", floor: "#1d262d" },
      };
      const root = document.getElementById("root");
      for (const [k, v] of Object.entries(PALETTES[PARAMS.palette])) root.style.setProperty("--" + k, v);

      document.getElementById("gBadgeT1").textContent = PARAMS.badge[0];
      document.getElementById("gBadgeT2").textContent = PARAMS.badge[1];

      const tl = gsap.timeline({ paused: true });
      const rig = GhostyRig.create(tl, { root: "#stage", shadow: "#gShadow", floorY: PARAMS.home.y });
      rig.place(PARAMS.home.x, PARAMS.home.y, PARAMS.home.s);
      rig.idle(0, PARAMS.duration, PARAMS.idle);
      for (const [t, g, args] of PARAMS.steps) {
        if (g === "idle") continue;
        if (g === "look") rig.look(t, args.dir, args);
        else if (g === "accessory") rig.accessory(args.id, t, args);
        else rig[g](t, args);
      }

      // tarjetas de la demo: código del gesto + lista que se va palomeando
      const codes = document.getElementById("codes"), rowsEl = document.getElementById("rows");
      const names = [...new Set(PARAMS.steps.map((s) => s[1]))], rows = {};
      for (const n of names) { const r = document.createElement("div"); r.className = "row"; r.innerHTML = `<span class="dot"></span>${n}`; rowsEl.appendChild(r); rows[n] = r; r.setAttribute("data-s", n === PARAMS.steps[0][1] ? "on" : ""); }
      const S = PARAMS.steps, END = PARAMS.duration + 1;
      S.forEach(([t, g, , code, what], i) => {
        // la fila queda encendida hasta que entra OTRO gesto; el código, hasta el siguiente renglón de código
        const rowOff = (S.find((s, j) => j > i && s[0] > t && s[1] !== g) || [END])[0];
        const codeOff = (S.find((s, j) => j > i && s[0] > t && s[3]) || [END])[0];
        if (code) {
          const c = document.createElement("div"); c.className = "code"; c.innerHTML = `<b>${code}</b><i>${what}</i>`; codes.appendChild(c);
          tl.set(c, { visibility: i === 0 ? "visible" : "hidden" }, 0);
          tl.set(c, { visibility: "visible" }, t); tl.set(c, { visibility: "hidden" }, codeOff);
        }
        if (t > 0) tl.set(rows[g], { attr: { "data-s": "on" } }, t); // el estado del cuadro 0 va en el DOM
        if (rowOff <= PARAMS.duration && !S.some((s) => s[1] === g && s[0] > t && s[0] <= rowOff)) tl.set(rows[g], { attr: { "data-s": "done" } }, rowOff);
      });

      rig.finalize(PARAMS.duration);
      window.__sfxCues = rig.cues;
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
