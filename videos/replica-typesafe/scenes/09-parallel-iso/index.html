<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Replica TypeSafe 09 — parallel + isométrico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #000; }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: Inter, system-ui, sans-serif; }
      .clip { position: absolute; inset: 0; }
      .ch { display: none; white-space: pre; vertical-align: top; }
      .cursor { display: inline-block; width: 4px; height: 0.9em; background: #ee6f9f; vertical-align: -0.05em; margin-left: 4px; }

      /* ---- 1. subtítulos sobre negro ---- */
      #captions { background: #000; color: #fff; display: grid; place-items: center; font-size: 96px; letter-spacing: -3px; }
      #captions .w { display: inline-block; white-space: pre; }
      #captions .pink { color: #ee6f9f; }

      /* ---- 2. entrevistado + malla ---- */
      #interview { background: url(assets/bg.png) 0 0 / 1280px 720px no-repeat; color: #fff; }
      #headline { position: absolute; left: 100px; top: 42px; font-size: 90px; line-height: 84px; letter-spacing: -3.5px; }
      #leader { position: absolute; left: 0; top: 0; overflow: visible; }
      #grid { position: absolute; left: 0; top: 0; overflow: visible; }
      #tag { position: absolute; left: 662px; top: 565px; height: 108px; box-sizing: border-box;
             border: 1px solid rgba(255,255,255,0.85); padding: 10px 18px 0; font-size: 38px; line-height: 44px;
             letter-spacing: -1px; white-space: nowrap; overflow: hidden; }
      #tag .line { height: 44px; }
      .bracket { position: absolute; width: 12px; height: 12px; border: 1px solid #fff; }
      .bracket.tl { border-right: none; border-bottom: none; }
      .bracket.br { border-left: none; border-top: none; }

      /* ---- 3. escena rosa isométrica ---- */
      #iso { background: #ee6f9f; color: #111; }
      #frame { position: absolute; left: 130px; top: 30px; width: 1020px; height: 660px; box-sizing: border-box; border: 2px solid #111; }
      #dots { position: absolute; inset: 0; }
      #stage { position: absolute; left: 0; top: 0; overflow: visible; }
      #logo { position: absolute; left: 38px; top: 32px; height: 54px; padding: 0 12px 0 8px; background: #111; color: #fff;
              display: flex; align-items: center; gap: 8px; font-size: 32px; letter-spacing: -1px; font-weight: 500; }
      #legend { position: absolute; left: 60px; top: 580px; font-family: "Geist Mono", monospace; font-size: 13px; color: #111; }
      #legend .title { position: absolute; left: 200px; top: 0; font-weight: 500; }
      #legend .low { position: absolute; left: 8px; top: 30px; line-height: 20px; }
      #legend .high { position: absolute; left: 434px; top: 30px; line-height: 20px; }
      #legend .thr { position: absolute; left: 258px; top: 76px; }
      #legend .steps { position: absolute; left: 44px; top: 36px; display: flex; }
      #legend .steps div { width: 36.8px; height: 22px; }
      #legend .tick { position: absolute; left: 290px; top: 30px; width: 2px; height: 36px; background: #111; }
      #label { position: absolute; left: 135px; top: 172px; height: 76px; box-sizing: border-box; padding: 10px 22px 0;
               border: 1px solid #fff; background: rgba(120, 30, 70, 0.55); color: #fff; font-size: 44px; line-height: 54px;
               letter-spacing: -1.5px; white-space: nowrap; overflow: hidden; }
      #label-leader { position: absolute; left: 0; top: 0; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-duration="11">

      <!-- 1. subtítulos sobre negro (0–1.75 s) -->
      <section id="captions" class="clip" data-start="0" data-duration="1.75" data-track-index="0">
        <div>
          <span class="w" id="w1">that transformers</span><span class="w pink" id="w2"> made</span><span class="w pink" id="w3">over</span><span class="w pink" id="w4"> RNNs</span>
        </div>
      </section>

      <!-- 2. entrevistado congelado + malla secuencial / paralela (1.75–6.4 s) -->
      <section id="interview" class="clip" data-start="1.75" data-duration="4.65" data-track-index="1">
        <div id="headline">
          <div><span class="tw" data-text="We are"></span></div>
          <div><span class="tw" data-text="replacing.."></span><span class="cursor" id="cursor1"></span></div>
        </div>
        <svg id="leader" width="1280" height="720" viewBox="0 0 1280 720">
          <path id="leader-path" d="M197 232 V262 Q197 300 240 300 H300 Q332 300 332 330 V372" fill="none" stroke="#fff" stroke-width="2.5" />
          <path id="leader2" d="M478 560 L660 630" fill="none" stroke="#fff" stroke-width="2" />
        </svg>
        <svg id="grid" width="1280" height="720" viewBox="0 0 1280 720"></svg>
        <div id="tag">
          <div class="line"><span class="tw" data-text="Sequential"></span></div>
          <div class="line"><span class="tw" data-text="computation"></span></div>
          <div class="line" id="tag-par" style="position:absolute; left:20px; top:12px"><span class="tw" data-text="Parallel"></span></div>
          <div class="bracket tl" style="left:-1px; top:-1px"></div>
          <div class="bracket br" style="right:-1px; bottom:-1px"></div>
        </div>
      </section>

      <!-- 3. isométrico rosa (6.4–11 s) -->
      <section id="iso" class="clip" data-start="6.4" data-duration="4.6" data-track-index="2">
        <svg id="dots" width="1280" height="720" viewBox="0 0 1280 720"></svg>
        <div id="frame"></div>
        <svg id="stage" width="1280" height="720" viewBox="0 0 1280 720"><g id="cam"><g id="bars"></g></g></svg>
        <div id="legend">
          <div class="title">CONFIDENCE</div>
          <div class="low">0.0<br />LOW</div>
          <div class="steps"></div>
          <div class="tick"></div>
          <div class="high">1.0<br />HIGH</div>
          <div class="thr">THRESHOLD</div>
        </div>
        <div id="logo">
          <svg width="30" height="30" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.1">
            <polygon points="7,1 12.5,4 12.5,10 7,13 1.5,10 1.5,4" /><polygon points="7,4 9.5,5.5 9.5,8.5 7,10 4.5,8.5 4.5,5.5" /><line x1="7" y1="1" x2="7" y2="4" /><line x1="7" y1="10" x2="7" y2="13" />
          </svg>
          TypeSafe
        </div>
        <svg id="label-leader" width="1280" height="720" viewBox="0 0 1280 720">
          <path id="label-path" d="M330 248 V330 Q330 350 350 356 L478 374" fill="none" stroke="#fff" stroke-width="2.5" />
          <circle id="label-dot" cx="478" cy="374" r="8" fill="#fff" />
        </svg>
        <div id="label">
          <span class="tw" data-text="Confidence level"></span>
          <div class="bracket tl" style="right:-1px; top:-1px; border-left:none; border-right:1px solid #fff; border-top:1px solid #fff; border-bottom:none"></div>
        </div>
      </section>
    </div>

    <script>
      const SVG = "http://www.w3.org/2000/svg";
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(90917);

      // typewriter: cada .tw se parte en spans colapsados
      document.querySelectorAll(".tw").forEach((el) => {
        el.textContent = "";
        for (const c of el.dataset.text) {
          const s = document.createElement("span");
          s.className = "ch"; s.textContent = c; el.appendChild(s);
        }
      });
      const tl = gsap.timeline({ paused: true });
      function typewrite(el, at, dur) {
        const chars = el.querySelectorAll(".ch");
        chars.forEach((c, i) => tl.set(c, { display: "inline-block" }, at + (i * dur) / chars.length));
      }

      /* ---------- 1. subtítulos ---------- */
      gsap.set(["#w2", "#w3", "#w4"], { display: "none" });
      tl.set("#w2", { display: "inline-block" }, 0.25);
      tl.set(["#w1", "#w2"], { display: "none" }, 0.5);
      tl.set("#w3", { display: "inline-block" }, 0.5);
      tl.set("#w4", { display: "inline-block" }, 0.75);
      tl.set(["#w3", "#w4"], { color: "#fff" }, 1.0);
      tl.set("#w2", { color: "#fff" }, 0.25);

      /* ---------- 2. malla con barril ---------- */
      const N = 8, CX = 330, CY = 517, HW = 122, HH = 122, K = 0.15;
      const grid = document.getElementById("grid");
      const cells = [];
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const u = (c - (N - 1) / 2) / ((N - 1) / 2), v = (r - (N - 1) / 2) / ((N - 1) / 2);
        // barril: las esquinas se meten, los lados se abultan
        const x = CX + u * HW * (1 + K * (1 - v * v)) * 0.88;
        const y = CY + v * HH * (1 + K * (1 - u * u)) * 0.88;
        const s = 27 * (1 - 0.16 * (u * u + v * v) / 2);
        const rc = document.createElementNS(SVG, "rect");
        rc.setAttribute("x", x - s / 2); rc.setAttribute("y", y - s / 2);
        rc.setAttribute("width", s); rc.setAttribute("height", s); rc.setAttribute("rx", 7);
        rc.setAttribute("fill", "#fff");
        grid.appendChild(rc); cells.push(rc);
      }
      gsap.set(cells, { autoAlpha: 0.22 });
      gsap.set("#grid", { scale: 0.35, transformOrigin: "330px 517px", autoAlpha: 0 });
      gsap.set("#tag", { autoAlpha: 0, width: 0 });
      gsap.set("#tag-par", { autoAlpha: 0 });
      gsap.set("#cursor1", { autoAlpha: 0 });

      const S = 1.75; // arranque de la sección 2 (tiempos absolutos)
      // "We are" ya está; "replacing.." se escribe con cursor rosa
      typewrite(document.querySelectorAll("#headline .tw")[0], S - 0.1, 0.05);
      tl.set("#cursor1", { autoAlpha: 1 }, S + 0.15);
      typewrite(document.querySelectorAll("#headline .tw")[1], S + 0.2, 0.32);
      tl.set("#cursor1", { autoAlpha: 0 }, S + 0.7);
      // línea guía se dibuja y la malla se abre
      const lp = document.getElementById("leader-path"), lpLen = lp.getTotalLength();
      gsap.set(lp, { strokeDasharray: lpLen, strokeDashoffset: lpLen });
      tl.to(lp, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, S + 0.55);
      tl.to("#grid", { autoAlpha: 1, duration: 0.15 }, S + 0.85);
      tl.to("#grid", { scale: 1, duration: 0.7, ease: "back.out(1.4)" }, S + 0.85);
      // etiqueta: caja crece y escribe "Sequential computation"
      const l2 = document.getElementById("leader2"), l2Len = l2.getTotalLength();
      gsap.set(l2, { strokeDasharray: l2Len, strokeDashoffset: l2Len });
      tl.to("#tag", { autoAlpha: 1, width: 345, duration: 0.3, ease: "power2.out" }, S + 0.45);
      typewrite(document.querySelectorAll("#tag .tw")[0], S + 0.55, 0.3);
      typewrite(document.querySelectorAll("#tag .tw")[1], S + 0.75, 0.35);
      tl.to(l2, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, S + 1.1);
      // llenado secuencial, fila por fila
      cells.forEach((c, i) => tl.to(c, { autoAlpha: 1, duration: 0.08 }, S + 1.0 + i * (1.15 / 64)));
      // 4.0 s: se apaga todo, la etiqueta cambia a "Parallel" y se llena de golpe
      tl.to(cells, { autoAlpha: 0.22, duration: 0.08 }, S + 2.2);
      tl.to("#tag", { width: 200, height: 66, duration: 0.2, ease: "power2.out" }, S + 2.25);
      tl.set("#tag .line:not(#tag-par)", { autoAlpha: 0 }, S + 2.25);
      tl.set("#tag-par", { autoAlpha: 1 }, S + 2.3);
      typewrite(document.querySelector("#tag-par .tw"), S + 2.3, 0.25);
      tl.to(cells, { autoAlpha: 1, duration: 0.12, ease: "power1.out" }, S + 2.45);
      // pulso suave de todo el bloque mientras espera
      tl.to("#grid", { scale: 1.03, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, S + 2.6);

      /* ---------- 3. isométrico ---------- */
      // fondo: puntitos regulares + dither de esquinas (cuadritos por PRNG con densidad radial)
      const dots = document.getElementById("dots");
      for (let x = 165; x < 1150; x += 34) for (let y = 65; y < 690; y += 34) {
        const d = document.createElementNS(SVG, "rect");
        d.setAttribute("x", x); d.setAttribute("y", y); d.setAttribute("width", 2); d.setAttribute("height", 2); d.setAttribute("fill", "#c85684");
        dots.appendChild(d);
      }
      const blobs = [[0, 420, 260], [1280, 420, 260], [640, 760, 200]];
      for (let i = 0; i < 9000; i++) {
        const b = blobs[i % 3];
        const a = rand() * Math.PI * 2, rr = Math.sqrt(rand()) * b[2];
        const x = b[0] + Math.cos(a) * rr, y = b[1] + Math.sin(a) * rr;
        const dens = 1 - rr / b[2];
        if (rand() > dens * dens * 2.2) continue;
        const d = document.createElementNS(SVG, "rect");
        const s = 2 + Math.round(rand() * 2);
        d.setAttribute("x", Math.round(x / 3) * 3); d.setAttribute("y", Math.round(y / 3) * 3);
        d.setAttribute("width", s); d.setAttribute("height", s); d.setAttribute("fill", "#111");
        dots.appendChild(d);
      }

      // cubos isométricos 8×8: tres caras por barra, orden de pintado de atrás hacia adelante
      const bars = document.getElementById("bars");
      const ICX = 610, ICY = 300, W = 41, H = 20.5, TW = 36; // TW = medio ancho del cubo (deja canal entre cubos)
      const cubes = [];
      const conf = [];
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const dx = i - 3.5, dy = j - 3.5;
        const c = Math.max(0, Math.min(1, 1.22 - Math.sqrt(dx * dx + dy * dy) / 4.2 + (rand() - 0.5) * 0.16));
        conf.push({ i, j, c });
      }
      conf.sort((a, b) => (a.i + a.j) - (b.i + b.j));
      conf.forEach(({ i, j, c }) => {
        const bx = ICX + (i - j) * W, by = ICY + (i + j) * H;
        const g = 236 - Math.round(c * 210);
        const top = `rgb(${g},${g},${g})`, left = `rgb(${g * 0.78 | 0},${g * 0.78 | 0},${g * 0.78 | 0})`, right = `rgb(${g * 0.6 | 0},${g * 0.6 | 0},${g * 0.6 | 0})`;
        const grp = document.createElementNS(SVG, "g");
        const mk = (fill) => { const p = document.createElementNS(SVG, "polygon"); p.setAttribute("fill", fill); p.setAttribute("stroke", "#222"); p.setAttribute("stroke-width", "0.8"); p.setAttribute("stroke-linejoin", "round"); grp.appendChild(p); return p; };
        const pl = mk(left), pr = mk(right), pt = mk(top);
        bars.appendChild(grp);
        const th = TW * H / W;
        const cube = { bx, by, h: 0, target: 24 + c * 240, pl, pr, pt, th };
        cube.draw = () => {
          const { bx, by, h } = cube;
          pt.setAttribute("points", `${bx},${by - th - h} ${bx + TW},${by - h} ${bx},${by + th - h} ${bx - TW},${by - h}`);
          pl.setAttribute("points", `${bx - TW},${by} ${bx},${by + th} ${bx},${by + th - h} ${bx - TW},${by - h}`);
          pr.setAttribute("points", `${bx},${by + th} ${bx + TW},${by} ${bx + TW},${by - h} ${bx},${by + th - h}`);
        };
        cube.h = 6; cube.draw();
        cubes.push(cube);
      });
      // placa rosa clara bajo la malla + borde punteado
      const plate = document.createElementNS(SVG, "polygon");
      const pad = 24;
      plate.setAttribute("points", `${ICX},${ICY - H - pad * 0.5} ${ICX + 8 * W + pad},${ICY + 7 * H} ${ICX},${ICY + 15 * H + pad * 0.5} ${ICX - 8 * W - pad},${ICY + 7 * H}`);
      plate.setAttribute("fill", "#f6a3c3"); plate.setAttribute("opacity", "0.8");
      bars.parentNode.insertBefore(plate, bars);
      const dash = document.createElementNS(SVG, "polyline");
      dash.setAttribute("points", `${ICX - 8 * W - pad},${ICY + 7 * H} ${ICX},${ICY + 15 * H + pad * 0.5} ${ICX + 8 * W + pad},${ICY + 7 * H}`);
      dash.setAttribute("fill", "none"); dash.setAttribute("stroke", "#fff"); dash.setAttribute("stroke-width", "2"); dash.setAttribute("stroke-dasharray", "8 7");
      bars.parentNode.insertBefore(dash, bars);

      // leyenda: 10 escalones de gris
      const steps = document.querySelector("#legend .steps");
      for (let k = 0; k < 10; k++) { const d = document.createElement("div"); const g = 236 - Math.round((k / 9) * 210); d.style.background = `rgb(${g},${g},${g})`; steps.appendChild(d); }

      const I = 6.4; // arranque de la sección 3
      gsap.set("#stage", { scale: 0.001, transformOrigin: "610px 460px" });
      gsap.set("#legend", { autoAlpha: 0, y: 20 });
      gsap.set("#logo", { autoAlpha: 0 });
      gsap.set("#label", { autoAlpha: 0, width: 0 });
      gsap.set("#label-dot", { autoAlpha: 0 });
      const labp = document.getElementById("label-path"), labLen = labp.getTotalLength();
      gsap.set(labp, { strokeDasharray: labLen, strokeDashoffset: labLen });
      gsap.set("#cam", { svgOrigin: "321 49" });

      // la malla entra escalando (viene de la malla blanca) y luego crecen los cubos, del centro hacia afuera
      tl.to("#stage", { scale: 1, duration: 0.45, ease: "power3.out" }, I);
      cubes.forEach((cb) => {
        const dist = Math.abs(cb.bx - ICX) / W + Math.abs(cb.by - (ICY + 7 * H)) / H;
        tl.to(cb, { h: cb.target, duration: 0.7, ease: "power2.out", onUpdate: cb.draw }, I + 0.3 + dist * 0.035);
      });
      tl.to("#legend", { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" }, I + 0.6);
      tl.to("#frame", { scaleX: 1.186, scaleY: 1.003, transformOrigin: "center", duration: 0.35, ease: "power2.inOut" }, I + 0.8);
      tl.to("#logo", { autoAlpha: 1, duration: 0.15 }, I + 0.95);
      // 8.75 s: la cámara se acerca a la esquina izquierda-abajo
      tl.to("#cam", { scale: 1.5, duration: 1.0, ease: "power2.inOut" }, I + 2.3);
      tl.to("#legend", { autoAlpha: 0, duration: 0.2 }, I + 2.3);
      tl.to("#label", { autoAlpha: 1, width: 380, duration: 0.25, ease: "power2.out" }, I + 3.0);
      typewrite(document.querySelector("#label .tw"), I + 3.05, 0.5);
      tl.to("#label-dot", { autoAlpha: 1, duration: 0.1 }, I + 3.2);
      tl.to(labp, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, I + 3.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
