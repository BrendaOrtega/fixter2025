<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
      body { font-family: Inter, system-ui, sans-serif; color: #fff; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      /* plano del entrevistado: cuadro congelado (ya trae el rótulo "What you build with / Jev") */
      #still { position: absolute; inset: 0; width: 1280px; height: 720px; background: url(ref/f_001.png) center/cover; }
      /* logo hexagonal, centrado */
      .logo { position: absolute; left: 640px; top: 360px; width: 240px; height: 240px; margin: -120px 0 0 -120px; }
      .logo svg { width: 100%; height: 100%; overflow: visible; }
      .logo path, .logo polygon { fill: none; stroke: #fff; stroke-width: 7; stroke-linejoin: miter; }
      /* retícula de cruces */
      #grid { position: absolute; inset: 0; }
      /* cajas con borde blanco: cada una vive en una ventana recortada anclada a la línea guía */
      .win { position: absolute; overflow: hidden; }
      .box { position: absolute; top: 0; height: 100%; border: 2px solid #fff; display: flex; align-items: center; padding: 0 30px; font-size: 92px; font-weight: 400; letter-spacing: -3px; white-space: nowrap; line-height: 1; }
      /* esquinas pequeñas por fuera de la caja */
      .corner { position: absolute; width: 14px; height: 14px; border: 2px solid #fff; }
      .corner.tl { border-right: 0; border-bottom: 0; }
      .corner.bl { border-right: 0; border-top: 0; }
      .corner.tr { border-left: 0; border-bottom: 0; }
      .corner.br { border-left: 0; border-top: 0; }
      /* línea guía vertical */
      #vline { position: absolute; top: 0; width: 2px; height: 720px; background: #fff; left: 805px; }
      #hline { position: absolute; left: 0; width: 1280px; height: 1px; background: #fff; top: 312px; opacity: 0.6; }
      /* cierre: brackets alrededor del logo y wordmark */
      .brk { position: absolute; width: 16px; height: 16px; border: 2px solid #fff; }
      #wordmark { position: absolute; left: 0; right: 0; top: 452px; text-align: center; font-size: 46px; font-weight: 400; letter-spacing: -1.5px; }
      #wordmark .ch { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.5" data-width="1280" data-height="720">
      <!-- 0.0–0.5: entrevistado -->
      <div class="clip" id="s-still" data-start="0" data-duration="0.5"><div id="still"></div></div>

      <!-- 0.5–2.3: logo que crece y se duplica -->
      <div class="clip" id="s-logo" data-start="0.5" data-duration="1.8">
        <div class="logo" id="logo1">
          <svg viewBox="0 0 120 120">
            <g id="hexB" opacity="0">
              <polygon points="60,2 98,24 98,96 60,118 22,96 22,24" transform="translate(-20,-24)" />
              <path d="M60 2 V60 L22 82 M60 60 L98 38" transform="translate(-20,-24)" />
            </g>
            <g id="hexA">
              <polygon points="60,2 98,24 98,96 60,118 22,96 22,24" />
              <path d="M60 2 V60 L22 82 M60 60 L98 38 M41 49 V71" />
            </g>
          </svg>
        </div>
      </div>

      <!-- 2.3–4.7: retícula + cajas apiladas -->
      <div class="clip" id="s-boxes" data-start="2.3" data-duration="2.4">
        <svg id="grid" width="1280" height="720">
          <defs>
            <pattern id="plus" width="45" height="45" patternUnits="userSpaceOnUse">
              <path d="M22.5 15 V30 M15 22.5 H30" stroke="#2c2c2c" stroke-width="1.5" />
            </pattern>
          </defs>
          <rect width="1280" height="720" fill="url(#plus)" />
        </svg>
        <div id="hline"></div>
        <!-- "We're building": a la izquierda de la línea, entra deslizando desde la izquierda -->
        <div class="win" id="w1" style="left:0;top:158px;width:805px;height:156px">
          <div class="box" id="b1" style="right:0;width:625px">We’re building
            <div class="corner tl" style="left:-10px;top:-10px"></div>
            <div class="corner bl" style="left:-10px;bottom:-10px"></div>
          </div>
        </div>
        <!-- "Prod": a la derecha de la línea -->
        <div class="win" id="w2" style="left:805px;top:312px;width:475px;height:152px">
          <div class="box" id="b2" style="left:0;width:290px;justify-content:flex-end;font-size:100px">Prod
            <div class="corner tr" style="right:-10px;top:-10px"></div>
            <div class="corner br" style="right:-10px;bottom:-10px"></div>
          </div>
        </div>
        <!-- "Not God": otra vez a la izquierda -->
        <div class="win" id="w3" style="left:0;top:460px;width:805px;height:152px">
          <div class="box" id="b3" style="right:0;width:410px;font-size:92px">Not God</div>
        </div>
        <div id="vline"></div>
      </div>

      <!-- 4.7–8.5: logo con brackets + typesafe.ai -->
      <div class="clip" id="s-end" data-start="4.7" data-duration="3.8">
        <div class="logo" id="logo2">
          <svg viewBox="0 0 120 120">
            <g id="hexB2" opacity="0">
              <polygon points="60,2 98,24 98,96 60,118 22,96 22,24" transform="translate(-20,-24)" />
              <path d="M60 2 V60 L22 82 M60 60 L98 38" transform="translate(-20,-24)" />
            </g>
            <g>
              <polygon points="60,2 98,24 98,96 60,118 22,96 22,24" />
              <path d="M60 2 V60 L22 82 M60 60 L98 38 M41 49 V71" />
            </g>
          </svg>
        </div>
        <div id="brks">
          <div class="brk" style="border-right:0;border-bottom:0"></div>
          <div class="brk" style="border-left:0;border-bottom:0"></div>
          <div class="brk" style="border-right:0;border-top:0"></div>
          <div class="brk" style="border-left:0;border-top:0"></div>
        </div>
        <div id="wordmark"></div>
      </div>
    </div>

    <script>
      // wordmark letra por letra
      const wm = document.getElementById("wordmark");
      "typesafe.ai".split("").forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; wm.appendChild(s); });

      const tl = gsap.timeline({ paused: true });
      // --- logo: pequeño → grande → se duplica ---
      gsap.set("#logo1", { scale: 0.33, transformOrigin: "50% 50%" });
      tl.to("#logo1", { scale: 0.72, duration: 0.7, ease: "power2.out" }, 0.5)
        .to("#hexB", { opacity: 1, duration: 0.12 }, 1.45)
        .to("#logo1", { x: 14, y: 18, scale: 0.8, duration: 0.3, ease: "power2.out" }, 1.45);

      // --- cajas: la línea guía y cada caja entran con rebote, recortadas en la línea ---
      gsap.set("#vline", { x: -90 });
      gsap.set("#b1", { x: -900 });
      gsap.set("#b2", { x: -300 });
      gsap.set("#b3", { x: 500 });
      gsap.set("#hline", { scaleX: 0, transformOrigin: "63% 50%" });
      tl.to("#vline", { x: 0, duration: 0.7, ease: "back.out(1.4)" }, 2.3)
        .to("#b1", { x: 0, duration: 0.7, ease: "back.out(1.3)" }, 2.3)
        .to("#hline", { scaleX: 1, duration: 0.5, ease: "power2.out" }, 2.75)
        .to("#b2", { x: 0, duration: 0.6, ease: "back.out(1.3)" }, 2.85)
        .to("#b3", { x: 0, duration: 0.6, ease: "back.out(1.3)" }, 3.4);

      // --- cierre: logo encoge, brackets convergen, se duplica, sube y entra el wordmark ---
      gsap.set("#logo2", { scale: 0.55, transformOrigin: "50% 50%" });
      const brk = gsap.utils.toArray("#brks .brk");
      // posiciones iniciales (abiertas) y finales (cerradas, alrededor del logo subido)
      const open = [[490, 210], [772, 210], [490, 490], [772, 490]];
      const close = [[558, 240], [706, 240], [558, 394], [706, 394]];
      brk.forEach((el, i) => gsap.set(el, { left: open[i][0], top: open[i][1] }));
      brk.forEach((el, i) => tl.to(el, { left: close[i][0], top: close[i][1], duration: 0.9, ease: "power3.inOut" }, 4.7));
      tl.to("#logo2", { scale: 0.48, y: -36, duration: 0.9, ease: "power3.inOut" }, 4.7)
        .to("#hexB2", { opacity: 1, duration: 0.1 }, 5.55);
      // letras: llegan de abajo en rosa y aterrizan blancas, con stagger
      gsap.set("#wordmark .ch", { y: 40, opacity: 0, color: "#ee6f9f" });
      tl.to("#wordmark .ch", { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.8)", stagger: 0.055 }, 5.55)
        .to("#wordmark .ch", { color: "#fff", duration: 0.25, stagger: 0.055 }, 5.75);

      tl.to({}, { duration: 0.01 }, 8.49);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
