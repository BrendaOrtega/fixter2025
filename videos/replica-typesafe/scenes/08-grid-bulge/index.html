<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Replica TypeSafe — grid bulge (08)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #ee6f9f; }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #ee6f9f; font-family: Inter, system-ui, sans-serif; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "Geist Mono", "JetBrains Mono", monospace; }
      .ch { visibility: hidden; }

      /* ---- escena 0: dos terminales ---- */
      #terminals { background: #ee6f9f; }
      .term { position: absolute; top: 15px; width: 620px; height: 690px; background: #2b2226; border-radius: 14px; color: #f2b8c6; font-size: 12.5px; line-height: 16.5px; white-space: pre; overflow: hidden; padding: 12px 24px; box-sizing: border-box; }
      .term .title { text-align: center; font-size: 16px; letter-spacing: 1px; color: #f6d4dd; margin-bottom: 10px; }
      .term .lights { position: absolute; left: 22px; top: 14px; display: flex; gap: 7px; }
      .term .lights i { width: 13px; height: 13px; border-radius: 50%; display: block; }
      .term .tag { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: #f1e5e8; color: #3a2a30; border: 1px solid #c9b0b8; padding: 8px 26px; font-size: 18px; }

      /* ---- escena 1: panel LLM sobre rosa ---- */
      #pink { background: #ee6f9f; }
      #dither { position: absolute; left: 0; top: 0; }
      #panel { position: absolute; left: 652px; top: 32px; width: 588px; height: 653px; border: 2px solid #1c1c1c; box-sizing: border-box; transform-origin: 0% 50%; }
      #llm-tag { position: absolute; left: -2px; top: -2px; background: #1c1c1c; color: #ee6f9f; font-size: 30px; padding: 8px 12px 10px 12px; letter-spacing: 2px; }
      #grid { position: absolute; left: 0; top: 0; overflow: visible; }
      #counter { position: absolute; left: 34px; bottom: 34px; background: #eae4d8; color: #1c1c1c; font-size: 22px; padding: 10px 20px; border: 2px solid #cfc7ba; transform-origin: 0% 100%; }
      #counter::before, #counter::after { content: ""; position: absolute; width: 8px; height: 8px; border: 1.5px solid #1c1c1c; }
      #counter::before { left: 6px; top: 6px; border-right: none; border-bottom: none; }
      #counter::after { right: 6px; bottom: 6px; border-left: none; border-top: none; }
      #headline { position: absolute; left: 98px; top: 148px; font-size: 58px; line-height: 70px; font-weight: 500; letter-spacing: -1.5px; color: #1c1c1c; }
      #headline .w { display: inline-block; margin-right: 13px; }
      #headline .w:last-child { margin-right: 0; }
      #connector { position: absolute; left: 0; top: 0; overflow: visible; }

      /* ---- escena 2: blanco ---- */
      #white { background: #fff; }
      #rings { position: absolute; left: 0; top: 0; }
      .box { position: absolute; background: #fff; border: 1px solid #ececec; box-shadow: 0 1px 0 #e6e6e6; box-sizing: border-box; display: flex; align-items: center; padding: 0 26px; font-size: 46px; letter-spacing: -1.2px; color: #111; white-space: pre; }
      #mini { position: absolute; left: 585px; top: 305px; width: 110px; height: 110px; border-radius: 20px; background: #ee6f9f; overflow: hidden; transform-origin: 50% 50%; }
      #but { position: absolute; left: 0; width: 1280px; top: 300px; text-align: center; font-size: 88px; letter-spacing: -2px; font-weight: 500; color: #ee6f9f; transform-origin: 50% 50%; }
      .corner { position: absolute; width: 9px; height: 9px; border: 1px solid #222; }

      /* ---- escena 3: entrevistado ---- */
      #bg { width: 1280px; height: 720px; object-fit: cover; }
      .wbox { position: absolute; border: 1.5px solid #fff; color: #fff; font-size: 84px; letter-spacing: -2px; padding: 0 22px; display: flex; align-items: center; box-sizing: border-box; white-space: pre; overflow: hidden; }
      #leader { position: absolute; left: 0; top: 0; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-duration="8.3">

      <!-- 0. terminales (0–0.55 s) -->
      <section id="terminals" class="clip mono" data-start="0" data-duration="0.63" data-track-index="0">
        <div class="term" id="term-a" style="left:15px">
          <div class="lights"><i style="background:#f05a5a"></i><i style="background:#f0c04a"></i><i style="background:#5ac46a"></i></div>
          <div class="title">TYPESAFE</div>
          <div class="body"></div>
          <div class="tag">typesafe</div>
        </div>
        <div class="term" id="term-b" style="left:645px">
          <div class="lights"><i style="background:#f05a5a"></i><i style="background:#f0c04a"></i><i style="background:#5ac46a"></i></div>
          <div class="title">LLM</div>
          <div class="body"></div>
          <div class="tag">gpt-5.6-terra</div>
        </div>
      </section>

      <!-- 1. rosa con panel LLM (0.55–3.25 s) -->
      <section id="pink" class="clip" data-start="0.63" data-duration="2.7" data-track-index="1">
        <div id="pink-inner" style="position:absolute;inset:0"><canvas id="dither" width="1280" height="720"></canvas>
        <div id="headline">
          <span class="w" data-w="0">Look</span><span class="w" data-w="1">at</span><span class="w" data-w="2">how</span><span class="w" data-w="3">the</span><br />
          <span class="w" data-w="4">LLM</span><span class="w" data-w="5">generates</span><br />
          <span class="w" data-w="6">sequentially</span>
        </div>
        <svg id="connector" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
          <path id="conn-path" d="M428 330 H512 Q536 330 536 354 V440 Q536 465 560 465 H622" stroke="#1c1c1c" stroke-width="2.5" />
          <circle id="conn-dot" cx="632" cy="465" r="8" fill="#1c1c1c" />
        </svg>
        <div id="panel">
          <div id="llm-tag" class="mono">LLM</div>
          <svg id="grid" width="588" height="653" viewBox="0 0 588 653"></svg>
          <div id="counter" class="mono"><span id="count">0</span>/36 COMPLETE</div>
        </div>
        </div>
      </section>

      <!-- 2. blanco (3.25–7.2 s) -->
      <section id="white" class="clip" data-start="3.33" data-duration="3.97" data-track-index="2">
        <svg id="rings" width="1280" height="720" viewBox="0 0 1280 720" fill="none" stroke="#e4e4e4" stroke-width="1">
          <circle cx="640" cy="360" r="110" /><circle cx="640" cy="360" r="280" />
          <line x1="640" y1="80" x2="650" y2="640" /><line x1="380" y1="470" x2="1010" y2="150" /><line x1="250" y1="580" x2="1000" y2="260" />
        </svg>
        <div class="corner" style="left:525px;top:278px;border-right:none;border-bottom:none"></div>
        <div class="corner" style="left:760px;top:445px;border-left:none;border-top:none"></div>
        <div class="corner" style="left:370px;top:335px;border-right:none;border-bottom:none"></div>
        <div class="corner" style="left:905px;top:378px;border-left:none;border-top:none"></div>
        <div class="box" id="box-great" style="left:210px;top:160px;width:405px;height:80px"><span class="tw" data-text="Which is great for"></span></div>
        <div class="box" id="box-natural" style="left:665px;top:480px;width:530px;height:80px"><span class="tw" data-text="a natural conversation"></span></div>
        <div class="box" id="box-useless" style="left:362px;top:150px;width:236px;height:86px"><span class="tw" data-text="Useless"></span></div>
        <div class="box" id="box-computers" style="left:677px;top:485px;width:385px;height:85px"><span class="tw" data-text="For computers"></span></div>
        <div id="mini"><svg id="mini-grid" width="110" height="110" viewBox="0 0 110 110"></svg></div>
        <div id="but">But</div>
      </section>

      <!-- 3. entrevistado (7.2–8.3 s): el clip de referencia, no hay cuadro limpio -->
      <img id="bg" class="clip" src="assets/still.png" data-start="7.3" data-duration="1.0" data-track-index="3" />
      <section id="talking" class="clip" data-start="7.3" data-duration="1.0" data-track-index="4">
        <svg id="leader" width="1280" height="720" viewBox="0 0 1280 720">
          <line id="leader-line" x1="470" y1="245" x2="680" y2="555" stroke="#fff" stroke-width="1.5" />
        </svg>
        <div class="wbox" id="w-llms" style="left:137px;top:110px;width:335px;height:135px"><span class="tw" data-text="LLMs"></span></div>
        <div class="corner" style="left:455px;top:120px;border-color:#fff;border-left:none;border-bottom:none"></div>
        <div class="corner" style="left:145px;top:232px;border-color:#fff;border-right:none;border-top:none"></div>
        <div class="wbox" id="w-extract" style="left:670px;top:545px;width:465px;height:85px;font-size:54px"><span class="tw" data-text="Extract intelligence"></span></div>
        <div class="corner" style="left:678px;top:618px;border-color:#fff;border-right:none;border-top:none"></div>
      </section>
    </div>

    <script>
      // PRNG con semilla fija: todo azar es reproducible cuadro a cuadro
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

      // ---- terminales: líneas de JSON falso ----
      const keys = ["Revenue currently impacted?", "What business impact?", "Integration issue present?", "Account health status?", "Which incident scope?", "Security concern present?", "Duplicate charge reported?", "Churn likelihood level?", "Scope certainty level?", "Human attention needed?", "Security risk level?", "Immediate feature request?", "Partner launch endangered?", "Credible churn risk?", "Production capability down?", "Customer data exposed?", "Server error reported?", "Financial impact level?", "Which response deadline?", "Repeated production failures?", "Which primary department?", "Which requested resolution?", "Language personally threatening?", "Concrete deadline stated?", "Which issue category?", "Technical specificity level?", "Resolution complexity level?"];
      const rnd0 = mulberry32(7);
      function termBody(el, parallel) {
        const head = parallel ? "$ uv run typesafe-race ask typesafe\n\nSending request to parallel TypeSafe API...\n\n{\n" : "$ uv run typesafe-race ask llm\n\nSending request to autoregressive OpenAI API. Waiting for first token...\n\n{\n";
        const lines = keys.map((k) => {
          const v = parallel ? `{"noul": ${(rnd0() * 0.99).toFixed(2)}, "type": "noul"},` : (rnd0() > 0.5 ? "true," : `"${["degraded", "watch", "today", "technical"][Math.floor(rnd0() * 4)]}",`);
          return `  "${k}": ${v}`;
        });
        el.textContent = head + lines.join("\n") + "\n}\n\n" + (parallel ? "cost $0.000081\ncompleted in 0.114s" : "cost $0.013880\ncompleted in 8.566s");
      }
      termBody(document.querySelector("#term-a .body"), true);
      termBody(document.querySelector("#term-b .body"), false);

      // ---- dither de esquinas: puntos con densidad radial, sin gradiente ----
      (function drawDither() {
        const ctx = document.getElementById("dither").getContext("2d");
        const rnd = mulberry32(42);
        ctx.fillStyle = "#1c1c1c";
        const blobs = [[40, 640, 330], [700, 790, 260]];
        for (const [cx, cy, R] of blobs) {
          for (let y = cy - R; y < cy + R; y += 3) for (let x = cx - R; x < cx + R; x += 3) {
            if (x < 0 || y < 0 || x > 1280 || y > 720) continue;
            const r = Math.hypot(x - cx, y - cy) / R; if (r > 1) continue;
            const p = Math.pow(1 - r, 2.2) * 0.85; // más denso al centro
            if (rnd() < p) ctx.fillRect(x, y, 2, 2);
          }
        }
      })();

      // ---- malla 6×6 con distorsión de barril precalculada ----
      const N = 6, CX = 294, CY = 350; // centro dentro del panel
      function barrel(u) { return u * 190 * (1 - 0.1 * u * u); } // posición
      function cellSize(u, v) { return 64 * (1 - 0.3 * u * u) * (1 - 0.3 * v * v); }
      const cells = [];
      const gridSvg = document.getElementById("grid");
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const u = (i - 2.5) / 2.5, v = (j - 2.5) / 2.5;
        const s = cellSize(u, v);
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", CX + barrel(u) - s / 2); r.setAttribute("y", CY + barrel(v) - s / 2);
        r.setAttribute("width", s); r.setAttribute("height", s); r.setAttribute("rx", s * 0.2);
        r.setAttribute("fill", "#d98aa5"); // celda vacía: rosa grisáceo
        gridSvg.appendChild(r); cells.push(r);
      }
      // malla chica: misma función, escala 110/588
      const miniCells = [];
      const mini = document.getElementById("mini-grid");
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const u = (i - 2.5) / 2.5, v = (j - 2.5) / 2.5; const s = cellSize(u, v) * 0.27;
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", 55 + barrel(u) * 0.27 - s / 2); r.setAttribute("y", 55 + barrel(v) * 0.27 - s / 2);
        r.setAttribute("width", s); r.setAttribute("height", s); r.setAttribute("rx", s * 0.28); r.setAttribute("fill", "#111");
        mini.appendChild(r); miniCells.push(r);
      }

      // ---- typewriter: cada caracter en un span oculto ----
      document.querySelectorAll(".tw").forEach((el) => {
        el.innerHTML = [...el.dataset.text].map((c) => `<span class="ch">${c === " " ? "&nbsp;" : c}</span>`).join("");
      });
      function typewrite(tl, sel, at, dur) {
        const chs = document.querySelectorAll(sel + " .ch");
        chs.forEach((c, k) => tl.set(c, { visibility: "visible" }, at + (dur * k) / chs.length));
      }

      const tl = gsap.timeline({ paused: true });
      const connPath = document.getElementById("conn-path"); const L = connPath.getTotalLength();

      // === escena 1 (tiempos absolutos) ===
      tl.fromTo("#panel", { scale: 0.86, x: -60 }, { scale: 1, x: 0, duration: 0.9, ease: "power3.out" }, 0.63);
      tl.fromTo("#counter", { scale: 0.4 }, { scale: 1, duration: 0.9, ease: "power3.out" }, 0.63);
      tl.set("#headline .w", { autoAlpha: 0 }, 0);
      [[0, 1.0], [1, 1.22], [2, 1.3], [3, 1.38], [4, 1.5], [5, 1.72], [6, 2.0]].forEach(([w, t]) => {
        tl.fromTo(`#headline .w[data-w="${w}"]`, { autoAlpha: 0, scale: 0.6, y: 10 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, t);
      });
      // conector: se dibuja y el punto llega al final
      tl.set(connPath, { strokeDasharray: L, strokeDashoffset: L }, 0);
      tl.set("#conn-dot", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%" }, 0);
      tl.fromTo("#conn-dot", { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, 1.75);
      tl.set("#conn-dot", { attr: { cx: 445, cy: 330 } }, 0);
      tl.to("#conn-dot", { attr: { cx: 632, cy: 465 }, duration: 0.5, ease: "power2.inOut" }, 2.05);
      tl.to(connPath, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 2.05);
      // llenado secuencial: ~11.5 celdas por segundo desde 0.78 s
      const countEl = document.getElementById("count");
      for (let k = 0; k < 36; k++) {
        const t = 0.78 + k / 11.5;
        tl.fromTo(cells[k], { attr: { fill: "#d98aa5" }, scale: 1, transformOrigin: "50% 50%" }, { attr: { fill: "#2f3033" }, duration: 0.08 }, t);
        tl.fromTo(cells[k], { scale: 1.25 }, { scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, t);
        tl.call(() => { countEl.textContent = String(k + 1); }, null, t);
      }
      // zoom-punch justo antes del corte
      tl.to("#pink-inner", { scale: 1.035, transformOrigin: "60% 50%", duration: 0.3, ease: "power2.in" }, 3.03);

      // === escena 2 ===
      tl.set("#but", { autoAlpha: 0 }, 0);
      tl.fromTo("#mini", { scale: 0.15 }, { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.6)" }, 3.33);
      // celdas de la mini malla cambian de negro a rosa en tandas deterministas
      const rndM = mulberry32(99);
      for (let step = 0; step < 9; step++) {
        const t = 3.4 + step * 0.25;
        miniCells.forEach((c) => tl.set(c, { attr: { fill: rndM() < 0.45 ? "#111" : "#ee6f9f" } }, t));
      }
      tl.set(["#box-great", "#box-natural", "#box-useless", "#box-computers"], { autoAlpha: 0 }, 0);
      tl.fromTo("#box-great", { autoAlpha: 0, scale: 0.8, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 3.4);
      typewrite(tl, "#box-great", 3.45, 0.7);
      tl.fromTo("#box-natural", { autoAlpha: 0, scale: 0.8, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 3.7);
      typewrite(tl, "#box-natural", 3.75, 0.8);
      // 5.5: la malla chica se va y entra "But" rosa, luego negro
      tl.to("#mini", { scale: 0, duration: 0.25, ease: "back.in(2)" }, 5.4);
      tl.fromTo("#but", { autoAlpha: 0, scale: 0.5 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 5.5);
      tl.to("#but", { color: "#111", duration: 0.3 }, 5.8);
      // 6.0: Useless sustituye a "Which is great for"
      tl.to("#box-great", { autoAlpha: 0, scale: 0.85, duration: 0.2 }, 5.95);
      tl.fromTo("#box-useless", { autoAlpha: 0, scale: 0.8, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 6.0);
      typewrite(tl, "#box-useless", 6.05, 0.3);
      // 6.5: For computers sustituye a "a natural conversation"
      tl.to("#box-natural", { autoAlpha: 0, scale: 0.85, duration: 0.2 }, 6.4);
      tl.fromTo("#box-computers", { autoAlpha: 0, scale: 0.8, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 6.5);
      typewrite(tl, "#box-computers", 6.55, 0.4);

      // === escena 3 ===
      tl.fromTo("#w-llms", { scaleX: 0.3, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 7.3);
      typewrite(tl, "#w-llms", 7.35, 0.5);
      tl.fromTo("#leader-line", { attr: { x2: 470, y2: 245 } }, { attr: { x2: 680, y2: 555 }, duration: 0.4, ease: "power2.inOut" }, 7.6);
      tl.fromTo("#w-extract", { autoAlpha: 0, scaleX: 0.3, transformOrigin: "0% 50%" }, { autoAlpha: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, 7.8);
      typewrite(tl, "#w-extract", 7.85, 0.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
