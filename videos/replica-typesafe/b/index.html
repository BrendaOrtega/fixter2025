<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>replica-typesafe-b</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Enfoque B: sólo CSS keyframes con delays absolutos (seek-safe para HyperFrames).
     Recetas motion-anything adaptadas: pixel-transition (retícula de tiles con --d),
     text-scramble (capas de glifos por carácter, sin rAF) y typewriter (una capa por letra). */
  :root {
    --white: #f4f2ee;
    --pink: #e8679a;
    --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Inter", system-ui, sans-serif;
  }
  html, body { margin: 0; background: #000; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #1a1a1a; }
  #bg { position: absolute; inset: 0; width: 1280px; height: 720px; object-fit: cover; }

  /* animación base: visible sólo mientras corre (fill none) o desde que arranca (fill both) */
  @keyframes hold { from { opacity: 1 } to { opacity: 1 } }
  .on   { opacity: 0; animation: hold 1s steps(1) forwards; } /* aparece en --t y se queda (forwards: sin relleno hacia atrás) */
  .flash{ opacity: 0; animation: hold 1s steps(1) none; }   /* visible sólo en [--t, --t+dur] */
  .on, .flash { animation-delay: var(--t); animation-duration: var(--dur, 1s); }

  /* la ventana original deriva con la cámara: traslación lenta y lineal sobre todo el overlay */
  #overlay { position: absolute; inset: 0; animation: drift 7.5s linear both; }
  @keyframes drift { from { transform: translate(-8px, 34px) } to { transform: translate(28px, -56px) } }

  /* marcas de esquina finas (0 s) */
  .corner { position: absolute; width: 14px; height: 14px; border: 1px solid var(--white); opacity: .8; }
  .corner.tl { border-right: 0; border-bottom: 0; }
  .corner.br { border-left: 0; border-top: 0; }
  .corner.tr { border-left: 0; border-bottom: 0; }
  .corner.bl { border-right: 0; border-top: 0; }

  /* ventana retro */
  .win { position: absolute; left: 100px; top: 255px; width: 415px; font: 26px/1 var(--mono); color: var(--white); }
  .titlebar { position: relative; height: 72px; border: 1.5px solid var(--white); box-sizing: border-box;
              display: flex; align-items: center; padding: 0 22px; gap: 12px; }
  .titlebar .glyph { width: 30px; height: 30px; flex: none; }
  .titlebar .close { margin-left: auto; font-weight: 500; }
  .body { position: relative; border: 1.5px solid var(--white); border-top: 0; box-sizing: border-box;
          padding: 12px 22px 8px; overflow: hidden; animation: body-grow 1s steps(1, end) both; }
  /* el cuerpo se abre a saltos conforme entran líneas */
  @keyframes body-grow {
    0%   { max-height: 0; padding-top: 0; padding-bottom: 0; }
    12%  { max-height: 62px; padding-top: 12px; padding-bottom: 8px; }  /* 0.75 s */
    57%  { max-height: 104px; }                                          /* 4.00 s */
    67%  { max-height: 146px; }                                          /* 4.75 s */
    74%  { max-height: 188px; }                                         /* 5.25 s */
    100% { max-height: 188px; }
  }
  .line { position: relative; height: 42px; line-height: 42px; white-space: pre; }
  .line .ch { display: inline-block; }

  /* scramble: cada carácter apila 4 glifos; sólo uno está encendido a la vez */
  .scr { position: relative; display: inline-block; width: 1ch; height: 1em; vertical-align: top; }
  .scr span { position: absolute; left: 0; top: 0; }
  .scr .tmp { opacity: .55; }

  /* cursor rosa que corre delante del texto */
  .cursor { position: absolute; top: 8px; left: 0; width: 14px; height: 26px; background: var(--pink);
            animation: cursor-run var(--dur) steps(var(--n), end) both; animation-delay: var(--t); }
  @keyframes cursor-run { from { transform: translateX(0) } to { transform: translateX(calc(var(--n) * 1ch)) } }

  /* leader line dibujada con dashoffset */
  #leader { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; }
  #leader line { stroke: var(--white); stroke-width: 1; stroke-dasharray: 400; stroke-dashoffset: 400;
                 animation: draw .5s ease-out both; animation-delay: 2.0s; }
  @keyframes draw { to { stroke-dashoffset: 0 } }

  /* cortinilla de píxeles (pixel-transition adaptada: tiles con delay aleatorio sembrado) */
  #pix { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(16, 80px); grid-template-rows: repeat(9, 80px); }
  #pix .px { opacity: 0; animation: hold 1s steps(1) none; animation-delay: var(--t); animation-duration: var(--dur); }

  /* escena final: blanco con retícula fina (CSS, en vez de dot-grid que usa rAF) */
  #final { position: absolute; inset: 0; background-color: #fff;
           background-image: linear-gradient(#ececec 1px, transparent 1px), linear-gradient(90deg, #ececec 1px, transparent 1px);
           background-size: 64px 64px; --t: 6.45s; }
  #final .pill { position: absolute; left: 256px; top: 266px; padding: 8px 48px; background: var(--pink); color: #1a1a1a;
                 font: 400 38px/1.1 var(--sans); --t: 6.45s; }
  #final .conn { position: absolute; inset: 0; width: 1280px; height: 720px; }
  #final .conn path { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-dasharray: 600; stroke-dashoffset: 600;
                      animation: draw .45s ease-out both; animation-delay: 6.5s; }
  #final .caption { position: absolute; left: 520px; top: 400px; font: 400 44px/1 var(--sans); letter-spacing: -.02em; color: #1a1a1a; white-space: pre; }
  #final .caption .ch { display: inline-block; }
  #final .mark { position: absolute; left: 510px; top: 445px; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1280" data-height="720" data-duration="7.5" data-start="0" data-no-timeline>
  <video id="bg" class="clip" src="clip.mp4" data-start="0" data-duration="7.5" data-track-index="0" muted></video>

  <div id="overlay">
  <!-- marcas de esquina, presentes desde el cuadro 0 -->
  <div class="corner tr" style="left:508px; top:244px"></div>
  <div class="corner bl" style="left:92px; top:396px"></div>

  <div class="win">
    <div class="titlebar on" style="--t:.25s">
      <svg class="glyph" viewBox="0 0 16 16" fill="none" stroke="#f4f2ee" stroke-width="1.2">
        <path d="M8 1.5 14 5v6l-6 3.5L2 11V5z"/><path d="M8 1.5v13M2 5l6 3.5L14 5"/>
      </svg>
      <span class="title" data-scramble="DIOGO ALMEIDA" data-t="0.25" data-dur="0.3"></span>
      <span class="close">×</span>
    </div>
    <div class="body" style="animation-delay:.6s; animation-duration:6.4s">
      <div class="line" data-type="founder of TypeSafe AI" data-t="0.8" data-dur="1.2" data-cursor="1"></div>
      <div class="line" data-type="CO-CREATED" data-t="4.0" data-dur="0.25"></div>
      <div class="line" data-type="  └ ChatGPT" data-t="4.75" data-dur="0.25"></div>
      <div class="line" data-type="  └ RLHF" data-t="5.25" data-dur="0.25"></div>
    </div>
  </div>

  <!-- leader line desde la esquina inferior derecha de la ventana -->
  <svg id="leader" viewBox="0 0 1280 720">
    <line x1="482" y1="462" x2="602" y2="630"/>
  </svg>
  <div class="corner br on" style="left:596px; top:624px; --t:2.4s"></div>
  </div>

  <!-- escena final bajo la cortinilla -->
  <div id="final" class="on">
    <svg class="conn" viewBox="0 0 1280 720">
      <path d="M0 464 H62 a10 10 0 0 0 10 -10 V302 a10 10 0 0 1 10 -10 H256 M488 292 H610"/>
    </svg>
    <div class="pill on">RLHF</div>
    <div class="caption" data-type="The post ⚲ training algorithm" data-t="6.75" data-dur="0.75"></div>
    <div class="corner bl on" style="left:504px; top:466px; --t:6.75s"></div>
    <div class="corner tr on" style="left:1186px; top:378px; --t:7.4s"></div>
    <div class="corner tr on" style="left:474px; top:250px; --t:6.45s"></div>
  </div>

  <!-- cortinilla de píxeles encima de todo -->
  <div id="pix"></div>
</div>

<script>
  // PRNG sembrado: el render debe ser idéntico cuadro a cuadro y entre corridas
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rnd = mulberry32(20260917);
  var GLYPHS = '!<>-_\\/[]{}=+*^?#';

  // typewriter: una capa por letra, encendida en t + i*paso (receta typewriter, sin rAF)
  document.querySelectorAll('[data-type]').forEach(function (el) {
    var txt = el.getAttribute('data-type'), t0 = +el.getAttribute('data-t'), dur = +el.getAttribute('data-dur');
    var step = dur / txt.length;
    txt.split('').forEach(function (c, i) {
      var s = document.createElement('span'); s.className = 'ch on'; s.textContent = c;
      s.style.setProperty('--t', (t0 + i * step).toFixed(3) + 's'); el.appendChild(s);
    });
    if (el.hasAttribute('data-cursor')) {
      var cur = document.createElement('span'); cur.className = 'cursor flash';
      cur.style.setProperty('--t', t0 + 's'); cur.style.setProperty('--dur', (dur + .15) + 's'); cur.style.setProperty('--n', txt.length);
      el.appendChild(cur);
    }
  });

  // scramble (text-scramble adaptada): 3 glifos temporales y luego la letra real, por carácter
  document.querySelectorAll('[data-scramble]').forEach(function (el) {
    var txt = el.getAttribute('data-scramble'), t0 = +el.getAttribute('data-t'), dur = +el.getAttribute('data-dur');
    txt.split('').forEach(function (c, i) {
      var slot = document.createElement('span'); slot.className = 'scr';
      var start = t0 + rnd() * dur * .4, end = start + dur * .35 + rnd() * dur * .25, k = 3, w = (end - start) / k;
      for (var j = 0; j < k; j++) {
        var g = document.createElement('span'); g.className = 'tmp flash';
        g.textContent = c === ' ' ? ' ' : GLYPHS[Math.floor(rnd() * GLYPHS.length)];
        g.style.setProperty('--t', (start + j * w).toFixed(3) + 's'); g.style.setProperty('--dur', w.toFixed(3) + 's');
        slot.appendChild(g);
      }
      var real = document.createElement('span'); real.className = 'on'; real.textContent = c;
      real.style.setProperty('--t', end.toFixed(3) + 's'); slot.appendChild(real);
      el.appendChild(slot);
    });
  });

  // cortinilla: 16×9 tiles de 80 px, blancos y grises, encendidos entre 6.0 y 6.45 s y apagados escalonados
  var pix = document.getElementById('pix');
  for (var i = 0; i < 16 * 9; i++) {
    var d = document.createElement('div'); d.className = 'px';
    var t = 6.0 + rnd() * .45, life = .25 + rnd() * .5;
    d.style.setProperty('--t', t.toFixed(3) + 's'); d.style.setProperty('--dur', life.toFixed(3) + 's');
    var g = rnd(); d.style.background = g < .5 ? '#fff' : g < .8 ? '#bdbdbd' : '#6f6f6f';
    pix.appendChild(d);
  }
</script>
</body>
</html>
