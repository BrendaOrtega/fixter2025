<!doctype html><html lang="es"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#E9E6DF; }
  body { font-family:"Space Grotesk", sans-serif; color:#111; position:relative; }
  .syne { font-family:"Syne", sans-serif; font-weight:800; }
  .mono { font-family:"Space Mono", monospace; font-weight:700; }
  #grid { position:absolute; inset:0; background-image:linear-gradient(#111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px); background-size:72px 72px; opacity:.07; }
  #av { position:absolute; left:72px; top:250px; width:132px; height:132px; overflow:hidden; background:#111; }
  #av img { width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(1) contrast(1.2); }
  #who { position:absolute; left:232px; top:256px; }
  #who b { display:block; font-family:"Syne"; font-weight:800; font-size:46px; letter-spacing:-.03em; color:#111; text-transform:uppercase; }
  #who span { display:block; margin-top:4px; font-family:"Space Mono"; font-size:22px; color:#111; }
  #clock { position:absolute; right:72px; top:250px; font-family:"Space Mono"; font-size:26px; color:#E9E6DF; background:#111; padding:16px 22px; }
  #sig { position:absolute; right:72px; top:346px; font-family:"Space Mono"; font-size:18px; color:#111; opacity:.6; }
  #sign { position:absolute; left:72px; right:72px; top:404px; height:250px; }
  #signin { font-family:"Syne"; font-weight:800; font-size:112px; line-height:1.02; letter-spacing:-.045em; color:#111; text-transform:uppercase; }
  #signin em { font-style:normal; background:#D6FF3A; padding:0 12px; }
  #stage { position:absolute; left:72px; top:676px; width:936px; height:496px; }
  #cap { position:absolute; left:60px; right:60px; top:1188px; height:200px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:700; font-size:70px; line-height:1.1; letter-spacing:-.02em; color:#111; }
  #cap .on { background:#111; color:#D6FF3A; padding:0 10px; }
  #cap .off { color:#777; font-weight:500; }
</style></head><body>
<div id="grid"></div>
<div id="sig">FIXTERGEEK.COM</div>
<div id="av"><img src="assets/face-still.png"/></div>
<div id="who"><b>Héctorbliss</b><span>SISTEMAS_AGÉNTICOS</span></div>
<div id="clock">SESIÓN 04</div>
<div id="sign"><div id="signin">¿QUIÉN<br/><em>ERES?</em></div></div>

<div id="stage"><svg viewBox="0 0 936 496" width="936" height="496" font-family="Syne" font-weight="800">
  <!-- columna X: sus 10 tickets, bloques negros -->
  <g>
    <rect x="0" y="0" width="300" height="70" fill="#111"/><text x="16" y="50" font-size="40" fill="#E9E6DF">X · 10</text>
    <g fill="#111">
      <rect x="0" y="86" width="56" height="56"/><rect x="61" y="86" width="56" height="56"/><rect x="122" y="86" width="56" height="56"/><rect x="183" y="86" width="56" height="56"/><rect x="244" y="86" width="56" height="56"/>
      <rect x="0" y="147" width="56" height="56"/><rect x="61" y="147" width="56" height="56"/><rect x="122" y="147" width="56" height="56"/><rect x="183" y="147" width="56" height="56"/><rect x="244" y="147" width="56" height="56"/>
    </g>
    <text x="0" y="240" font-family="Space Mono" font-weight="700" font-size="18" fill="#111">TICKETS DE X</text>
  </g>
  <!-- columna Y: sus 10 tickets, bloques rojos -->
  <g transform="translate(636 0)">
    <rect x="0" y="0" width="300" height="70" fill="#FF3B1F"/><text x="16" y="50" font-size="40" fill="#111">Y · 10</text>
    <g fill="#FF3B1F">
      <rect x="0" y="86" width="56" height="56"/><rect x="61" y="86" width="56" height="56"/><rect x="122" y="86" width="56" height="56"/><rect x="183" y="86" width="56" height="56"/><rect x="244" y="86" width="56" height="56"/>
      <rect x="0" y="147" width="56" height="56"/><rect x="61" y="147" width="56" height="56"/><rect x="122" y="147" width="56" height="56"/><rect x="183" y="147" width="56" height="56"/><rect x="244" y="147" width="56" height="56"/>
    </g>
    <text x="0" y="240" font-family="Space Mono" font-weight="700" font-size="18" fill="#111">TICKETS DE Y</text>
  </g>
  <!-- el token al centro: ácido, sin bordes -->
  <g transform="translate(330 0)">
    <rect x="0" y="0" width="276" height="203" fill="#D6FF3A"/>
    <text x="16" y="44" font-family="Space Mono" font-weight="700" font-size="20" fill="#111">TOKEN</text>
    <text x="16" y="118" font-size="64" fill="#111">X</text>
    <text x="16" y="176" font-family="Space Mono" font-weight="700" font-size="22" fill="#111">NIVEL: OPERACIÓN</text>
    <rect x="200" y="20" width="56" height="56" fill="#111"/><rect x="216" y="36" width="24" height="24" fill="#D6FF3A"/>
  </g>
  <!-- el servidor: la barra que deja o no pasar -->
  <rect x="0" y="292" width="936" height="120" fill="#111"/>
  <text x="24" y="368" font-size="56" fill="#E9E6DF" letter-spacing="-2">SERVIDOR</text>
  <text x="640" y="342" font-family="Space Mono" font-weight="700" font-size="22" fill="#D6FF3A">DECIDE</text>
  <text x="640" y="382" font-family="Space Mono" font-weight="700" font-size="22" fill="#E9E6DF">DEJA / NO DEJA PASAR</text>
  <!-- la compuerta: abierta a la izquierda (X), cerrada a la derecha (Y) -->
  <rect x="0" y="430" width="300" height="66" fill="#D6FF3A"/><text x="16" y="476" font-size="34" fill="#111">PASA →</text>
  <rect x="636" y="430" width="300" height="66" fill="#FF3B1F"/><text x="652" y="476" font-size="34" fill="#111">✕ NO PASA</text>
  <g transform="translate(330 430)"><rect width="276" height="66" fill="none" stroke="#111" stroke-width="4"/><text x="14" y="44" font-family="Space Mono" font-weight="700" font-size="20" fill="#111">SÓLO LO TUYO</text></g>
</svg></div>
<div id="cap">un <span class="on">token</span> que identifica</div>
</body></html>
