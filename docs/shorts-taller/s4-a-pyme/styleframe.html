<!doctype html><html lang="es"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#2A2320; }
  body { font-family:"Nunito", system-ui; color:#F5E9D6; position:relative; }
  #board { position:absolute; inset:0; }
  .fred { font-family:"Fredoka", system-ui; font-weight:700; }
  /* cabecera 250–390 */
  #av { position:absolute; left:72px; top:250px; width:132px; height:132px; border-radius:50%; overflow:hidden; border:10px solid #F5E9D6; box-shadow:8px 10px 0 #1A1512; }
  #av img { width:100%; height:100%; object-fit:cover; display:block; }
  #who { position:absolute; left:232px; top:262px; }

  #clock { position:absolute; right:72px; top:270px; font-family:"Fredoka"; font-weight:700; font-size:30px; letter-spacing:.06em; color:#2A2320; background:#F7C948; padding:14px 26px; border-radius:999px; box-shadow:6px 8px 0 #1A1512; transform:rotate(-3deg); }
  #sig { position:absolute; right:72px; top:214px; font-family:"JetBrains Mono"; font-size:20px; letter-spacing:.14em; color:#7A6B5C; }
  /* cartel 404–654 */
  #sign { position:absolute; left:72px; right:72px; top:404px; height:250px; }
  #signin { font-family:"Fredoka"; font-weight:700; font-size:118px; line-height:.94; letter-spacing:-.01em; color:#F5E9D6; text-shadow:8px 10px 0 #1A1512; }
  #signin em { font-style:normal; color:#F26B4E; display:inline-block; transform:rotate(-2deg); }
  /* escenario 676–1172 */
  #stage { position:absolute; left:72px; top:676px; width:936px; height:496px; }
  /* karaoke 1188–1388 */
  #cap { position:absolute; left:60px; right:60px; top:1188px; height:200px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:900; font-size:72px; line-height:1.12; letter-spacing:-.01em; color:#F5E9D6; text-shadow:4px 5px 0 #1A1512; }
  #cap .on { color:#F7C948; }
  #cap .off { color:#9C8B78; font-weight:500; text-shadow:none; }
</style></head><body>
<svg id="board" viewBox="0 0 1080 1920">
  <defs>
    <!-- huella digital: arcos concéntricos muy tenues -->
    <pattern id="huella" width="260" height="260" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <g fill="none" stroke="#F5E9D6" stroke-width="2" opacity=".07">
        <ellipse cx="130" cy="130" rx="30" ry="42"/><ellipse cx="130" cy="130" rx="52" ry="68"/><ellipse cx="130" cy="130" rx="74" ry="94"/><ellipse cx="130" cy="130" rx="96" ry="120"/>
      </g>
    </pattern>
    <!-- borde de plastilina: ondula el contorno -->
    <filter id="clay" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="#2A2320"/>
  <rect width="1080" height="1920" fill="url(#huella)"/>
  <!-- migas de plastilina en la tabla -->
  <g filter="url(#clay)">
    <circle cx="120" cy="140" r="14" fill="#F26B4E"/><circle cx="960" cy="180" r="10" fill="#7CC576"/><circle cx="1010" cy="1520" r="16" fill="#4FA8E8"/>
    <circle cx="80" cy="1600" r="11" fill="#F7C948"/><circle cx="540" cy="1760" r="13" fill="#F7C948"/><circle cx="200" cy="1840" r="9" fill="#F26B4E"/>
  </g>
</svg>

<div id="sig">fixtergeek.com</div>
<div id="av"><img src="assets/face-still.png"/></div>
<div id="who"><b>Héctorbliss</b><span>SISTEMAS AGÉNTICOS</span></div>
<div id="clock">SESIÓN 4</div>

<div id="sign"><div id="signin">CADA VIERNES,<br/><em>SOLITO</em></div></div>

    <g fill="#F5E9D6"><rect x="62" y="168" width="54" height="72" rx="8" transform="rotate(-14 89 204)"/><rect x="112" y="156" width="54" height="72" rx="8" transform="rotate(-4 139 192)"/><rect x="162" y="158" width="54" height="72" rx="8" transform="rotate(6 189 194)"/><rect x="208" y="172" width="54" height="72" rx="8" transform="rotate(16 235 208)"/></g>

    <g transform="translate(8 10)"><rect x="190" y="30" width="150" height="120" rx="16" fill="#1A1512"/></g>

    <text x="265" y="60" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="26" fill="#F5E9D6">VIERNES</text>
    <text x="265" y="126" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="52" fill="#2A2320">8:00</text>

</body></html>
