<!doctype html>
<meta charset="utf-8">
<title>Style frame 04a · Dos lugares donde vive el agente</title>
<style>html,body{margin:0;background:#0E1317}body{width:1920px;height:1080px;overflow:hidden;font-family:ui-monospace,Menlo,monospace}</style>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.2" fill="#1C262B"/></pattern></defs>
  <rect width="1920" height="1080" fill="#0E1317"/><rect width="1920" height="1080" fill="url(#dots)"/>

  <g id="title">
    <text x="960" y="110" text-anchor="middle" font-size="56" font-weight="900" fill="#F2F5F4">El agente vive en dos lugares</text>
    <text x="960" y="160" text-anchor="middle" font-size="28" fill="#85DDCB">uno piensa y guarda las llaves; el otro ejecuta y se puede tirar</text>
  </g>

  <!-- ===== Lugar 1: app runtime = la oficina ===== -->
  <g id="office">
    <rect x="140" y="260" width="740" height="520" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="140" y="260" width="740" height="520" rx="16" fill="#141C21" stroke="#85DDCB" stroke-width="4"/>
    <rect x="140" y="260" width="740" height="60" rx="16" fill="#85DDCB"/><rect x="140" y="300" width="740" height="20" fill="#85DDCB"/>
    <text x="510" y="302" text-anchor="middle" font-size="28" font-weight="900" fill="#0E1317">1 · app runtime (tu proceso Node)</text>
    <g id="office-ghost"><image xlink:href="ghosty.png" x="180" y="380" width="200" height="232" preserveAspectRatio="xMidYMid meet"/></g>
    <g id="office-items" font-size="24" fill="#F2F5F4">
      <text x="420" y="400">🧠  habla con el modelo</text>
      <text x="420" y="450">🔑  guarda API keys y secretos</text>
      <text x="420" y="500">📋  escribe los checkpoints</text>
      <text x="420" y="550">🛠  decide qué tool llamar</text>
      <text x="420" y="600" fill="#85DDCB">nunca ejecuta código del modelo</text>
    </g>
    <text x="510" y="740" text-anchor="middle" font-size="24" fill="#7C8A8E">aquí Ghosty piensa</text>
  </g>

  <!-- ===== Lugar 2: sandbox = la mesa de trabajo ===== -->
  <g id="bench">
    <rect x="1040" y="260" width="740" height="520" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="1040" y="260" width="740" height="520" rx="16" fill="#37AB93" stroke="#F2F5F4" stroke-width="4"/>
    <rect x="1040" y="260" width="740" height="60" rx="16" fill="#F2F5F4"/><rect x="1040" y="300" width="740" height="20" fill="#F2F5F4"/>
    <text x="1410" y="302" text-anchor="middle" font-size="28" font-weight="900" fill="#0E1317">2 · sandbox (contenedor, VM o caja)</text>
    <rect x="1070" y="350" width="680" height="380" rx="10" fill="#0E1317"/>
    <g id="bench-items" font-size="24" fill="#F2F5F4">
      <text x="1100" y="400">💻  corre bash y scripts</text>
      <text x="1100" y="450">📁  tiene /workspace (persiste)</text>
      <text x="1100" y="500">🚫  sin llaves, sin secretos</text>
      <text x="1100" y="550">🌐  red que tú decides</text>
      <text x="1100" y="600" fill="#85DDCB">se apaga sin perder la sesión</text>
    </g>
    <g id="bench-hands"><image xlink:href="ghosty.png" x="1590" y="380" width="130" height="152" preserveAspectRatio="xMidYMid meet"/></g>
    <text x="1410" y="690" text-anchor="middle" font-size="24" fill="#7C8A8E">aquí Ghosty hace</text>
  </g>

  <g id="footer">
    <text x="960" y="860" text-anchor="middle" font-size="26" fill="#7C8A8E">si el sandbox se rompe, se tira y se levanta otro; la sesión sigue viva en el runtime</text>
    <text x="960" y="904" text-anchor="middle" font-size="26" fill="#F2F5F4">self-hosted (ejemplo oficial): los dos en la misma máquina, el runtime como proceso y el sandbox como contenedor</text>
    <text x="960" y="948" text-anchor="middle" font-size="26" fill="#7C8A8E">Vercel managed: servicios separados · EasyBits: dos cajas (siguiente lámina)</text>
  </g>
</svg>
