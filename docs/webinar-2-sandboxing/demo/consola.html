<!doctype html><meta charset="utf-8"><title>EasyBits · consola del demo</title>
<style>
  @font-face{font-family:"Jersey 10";src:local("Jersey 10")}
  :root{--paper:#FBF6E4;--ink:#111;--violet:#7b4cd9;--yellow:#f9e16d;--orange:#f7a637;--red:#E4572E;
    --border:4px solid #111;--hard:8px 8px 0 #111}
  *{box-sizing:border-box}
  body{margin:0;padding:3vh 4vw;background:var(--paper);color:var(--ink);
    font-family:Cabin,ui-sans-serif,system-ui,sans-serif}
  header{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:2.4vh}
  h1{font-size:clamp(1.8rem,3.4vw,3rem);margin:0;letter-spacing:-.02em}
  .tag{background:var(--ink);color:var(--yellow);padding:.3em .7em;font-weight:800;
    letter-spacing:.14em;font-size:clamp(.7rem,1vw,.95rem);text-transform:uppercase}
  .cap{margin-left:auto;font-weight:800;font-size:clamp(1rem,1.6vw,1.4rem)}
  .runs{display:flex;flex-direction:column;gap:2vh}
  .run{background:#fff;border:var(--border);box-shadow:var(--hard);padding:1.1em 1.3em}
  .run.ok{background:var(--yellow)}
  .run.err{background:var(--red);color:var(--paper)}
  .run.live{background:var(--violet);color:var(--paper)}
  .run h2{margin:0 0 .35em;font-size:clamp(1.15rem,2vw,1.7rem)}
  .cmd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:clamp(.9rem,1.25vw,1.2rem);background:var(--ink);color:var(--paper);
    padding:.55em .75em;white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .out{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:clamp(.85rem,1.2vw,1.15rem);margin-top:.7em;white-space:pre;
    background:#fffdf4;border:3px solid #111;padding:.7em .85em;
    overflow:hidden;line-height:1.55}
  .run.err .out,.run.live .out{color:#111}
  .cmd .fl{color:#f9e16d}      /* banderas */
  .cmd .st{color:#9fe6c8}      /* cadenas */
  .cmd .url{color:#c9b6ff}
  .out .k{color:#7b4cd9;font-weight:700}
  .out .s{color:#0f7b52}
  .out .n{color:#b8541a}
  .ms{float:right;font-weight:800;font-size:clamp(1.4rem,3vw,2.6rem);line-height:1;
    letter-spacing:-.04em}
  .empty{opacity:.5;font-size:1.3rem}
  .pedir{display:flex;gap:1rem;margin-bottom:2vh}
  .pedir input{flex:1;border:var(--border);box-shadow:var(--hard);background:#fff;
    padding:.7em .9em;font:inherit;font-size:clamp(1rem,1.8vw,1.5rem)}
  .pedir button{border:var(--border);box-shadow:var(--hard);background:var(--orange);
    padding:.7em 1.4em;font:inherit;font-weight:800;font-size:clamp(1rem,1.8vw,1.5rem);cursor:pointer}
  .pedir button:active{transform:translate(4px,4px);box-shadow:none}
  .pedir button[disabled]{background:#ccc;cursor:wait}
  /* lo que se le ha pedido, del más nuevo al más viejo */
  .hist{display:flex;flex-direction:column;gap:.7vh;margin-bottom:2vh}
  .hist div{background:#fff;border:3px solid #111;padding:.55em .8em;
    font-size:clamp(1rem,1.5vw,1.3rem);display:flex;gap:.7em;align-items:baseline}
  .hist .est{margin-left:auto;font-weight:800;font-size:.8em;letter-spacing:.08em;
    text-transform:uppercase}
  .hist .corriendo{background:var(--yellow)}
  .hist .corriendo .est{color:#b8541a}
  /* la bitácora del agente, leída de su propia caja cada segundo */
  .log{background:var(--violet);color:var(--paper);border:var(--border);box-shadow:var(--hard);
    padding:1.1em 1.3em;margin-bottom:2vh}
  .log h2{margin:0 0 .5em;font-size:clamp(1.15rem,2vw,1.7rem)}
  .log #logurl{font-weight:400;opacity:.75;font-size:.7em;font-family:ui-monospace,monospace}
  .log pre{margin:0;background:#111;padding:.8em 1em;max-height:34vh;overflow:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:clamp(.9rem,1.25vw,1.15rem);line-height:1.6;white-space:pre-wrap}
  .log .t{color:#f9e16d;font-weight:700}
  .log .h{color:#9fe6c8}
  .log .ok{color:#f7a637}
</style>
<header>
  <span class="tag">EasyBits · flota en vivo</span>
  <h1>La caja donde vive tu agente</h1>
  <span class="cap" id="cap">—</span>
</header>
<form class="pedir" id="pedir">
  <input id="prompt" placeholder="Pídele algo al agente…" autocomplete="off">
  <button id="btn">Enviar</button>
</form>
<div class="hist" id="hist"></div>
<div class="log" id="log" hidden><h2>Bitácora del agente <span id="logurl"></span></h2><pre id="logtxt"></pre></div>
<div class="runs" id="runs"><p class="empty">Esperando el primer comando…</p></div>
<script>
// La consola no ejecuta nada: sólo lee lo que el guion ya corrió y lo pinta.
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// El curl se parte por banderas: una por renglón, como se escribe en un post.
// Ojo: primero se colorean comillas y URL, y las banderas al final — al revés,
// el propio atributo class="fl" cae en la regex de las cadenas.
function pintaCmd(cmd){
  return cmd.replace(/\s*\\\n\s*/g,'\n  ').replace(/ -([A-Za-z]) /g, '\n  -$1 ').split('\n').map(function(l){
    return esc(l)
      .replace(/(&quot;[^&]*?&quot;)/g, '\u0001$1\u0002')
      .replace(/(https?:\/\/[^\s]+)/, '\u0003$1\u0002')
      .replace(/^(\s*)(-[A-Za-z])/, '$1\u0004$2\u0002')
      .replace(/\u0001/g,'<span class="st">').replace(/\u0003/g,'<span class="url">')
      .replace(/\u0004/g,'<span class="fl">').replace(/\u0002/g,'</span>');
  }).join('\n');
}

// Sólo los campos que cuentan la historia. El resto es ruido de API y hace scroll.
const RUIDO = ["ownerId","hardExpiresAt","suspendedAt","createdAt","cpuMode","updatedAt"];
function pintaOut(out){
  let t = out;
  try {
    let o = JSON.parse(out);
    const limpia = v => {
      if (Array.isArray(v)) return v.slice(0,3).map(limpia);
      if (v && typeof v === "object") {
        const r = {};
        for (const k in v) if (!RUIDO.includes(k)) r[k] = limpia(v[k]);
        return r;
      }
      return v;
    };
    t = JSON.stringify(limpia(o), null, 2);
  } catch(e){}
  const lineas = t.split("\n");
  if (lineas.length > 12) t = lineas.slice(0,11).join("\n") + "\n  … (" + (lineas.length-11) + " renglones más)";
  return esc(t)
    .replace(/&quot;([^&]+?)&quot;:/g, '"<span class="k">$1</span>":')
    .replace(/: &quot;([^&]*?)&quot;/g, ': "<span class="s">$1</span>"')
    .replace(/: (\d+|true|false|null)/g, ': <span class="n">$1</span>');
}

async function tick(){
  try{
    const r = await fetch('runs.json?'+Date.now());
    const data = await r.json();
    document.getElementById('cap').textContent = data.capacidad || '';
    const el = document.getElementById('runs');
    if(!data.runs?.length) return;
    el.innerHTML = data.runs.slice().reverse().map(function(x){
      return '<div class="run '+(x.estado||'ok')+'">'
        + (x.ms!=null ? '<span class="ms">'+x.ms+' s</span>' : '')
        + '<h2>'+esc(x.paso)+'</h2>'
        + '<div class="cmd">'+pintaCmd(x.cmd)+'</div>'
        + (x.out ? '<div class="out">'+pintaOut(x.out)+'</div>' : '')
        + '</div>';
    }).join('');
  }catch(e){}
}
tick(); setInterval(tick, 700);

// La bitácora vive DENTRO de la caja y se sirve por su puerto 80: la leemos
// desde aquí igual que cualquier visitante. `logUrl` sale de runs.json.
async function tickLog(){
  try{
    const cfg = await (await fetch('runs.json?'+Date.now())).json();
    if(!cfg.logUrl) return;
    const caja = document.getElementById('log');
    caja.hidden = false;
    document.getElementById('logurl').textContent = cfg.logUrl.replace('https://','');
    const t = await (await fetch('/log?'+Date.now())).text();
    document.getElementById('logtxt').innerHTML = esc(t.trim().split('\n').slice(-40).join('\n'))
      .replace(/^(===.*)$/gm,'<span class="t">$1</span>')
      .replace(/^(\s*→.*)$/gm,'<span class="h">$1</span>')
      .replace(/^(\s*✓.*|---.*)$/gm,'<span class="ok">$1</span>');
    document.getElementById('logtxt').scrollTop = 1e6;
  }catch(e){}
}
tickLog(); setInterval(tickLog, 1000);

// El turno se dispara aquí. El texto se conserva en el historial (nunca se pierde
// lo que pediste) y el botón se bloquea mientras el agente trabaja.
const hist = [];
function pintaHist(){
  document.getElementById('hist').innerHTML = hist.slice().reverse().map(h =>
    '<div class="'+(h.fin?'':'corriendo')+'">'+esc(h.texto)
    + '<span class="est">'+(h.fin?'listo':'trabajando…')+'</span></div>').join('');
}
document.getElementById('pedir').addEventListener('submit', async function(e){
  e.preventDefault();
  const campo = document.getElementById('prompt'), btn = document.getElementById('btn');
  const texto = campo.value.trim(); if(!texto) return;
  const item = {texto, fin:false}; hist.push(item); pintaHist();
  campo.value = ''; btn.disabled = true; btn.textContent = 'Trabajando…';
  try{
    const r = await fetch('/turno', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({prompt: texto})});
    if(!r.ok) throw new Error(r.status);
  }catch(err){
    item.texto += '  ⚠ no salió: ' + err.message;
  }
  item.fin = true; pintaHist();
  btn.disabled = false; btn.textContent = 'Enviar'; campo.focus();
});
</script>
