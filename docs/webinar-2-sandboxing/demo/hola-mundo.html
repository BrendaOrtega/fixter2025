<!doctype html><meta charset="utf-8"><title>Hola desde una microVM</title>
<style>
 :root{--paper:#FBF6E4;--violet:#7b4cd9;--yellow:#f9e16d;--orange:#f7a637}
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);
   font-family:Cabin,ui-sans-serif,system-ui,sans-serif;color:#111;text-align:center;padding:6vh 5vw}
 h1{font-size:clamp(2rem,7vw,5rem);margin:.3em 0 0;letter-spacing:-.03em}
 p{font-size:clamp(1rem,2.4vw,1.6rem);max-width:26ch;margin:.6em auto 0}
 .tag{background:#111;color:var(--yellow);padding:.35em .8em;font-weight:800;
   letter-spacing:.16em;font-size:clamp(.65rem,1.4vw,.9rem);text-transform:uppercase}
 svg{width:min(46vw,300px)}
 .bot{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
 .ant{animation:blink 1.5s steps(1) infinite}
 @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
 .hand{transform-box:fill-box;transform-origin:bottom center;animation:wave 1.2s ease-in-out infinite}
 @keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(22deg)}}
 .sp{transform-box:fill-box;transform-origin:center;animation:sp 2.4s ease-in-out infinite}
 .sp2{animation-delay:.6s} .sp3{animation-delay:1.2s}
 @keyframes sp{0%,100%{transform:translateY(0) scale(.85);opacity:.35}
               50%{transform:translateY(-14px) scale(1.15);opacity:1}}
</style>
<div>
<svg viewBox="0 0 300 260" aria-label="Un agente saludando">
 <g stroke="#111" stroke-width="6" stroke-linejoin="round">
  <g fill="#7b4cd9">
   <rect class="sp" x="16" y="70" width="18" height="18" rx="3"/>
   <rect class="sp sp2" x="264" y="94" width="16" height="16" rx="3"/>
   <rect class="sp sp3" x="242" y="46" width="13" height="13" rx="3"/>
  </g>
  <g class="bot">
   <g class="hand"><rect x="216" y="112" width="30" height="66" rx="12" fill="#7b4cd9"/></g>
   <rect x="56" y="132" width="30" height="60" rx="12" fill="#7b4cd9"/>
   <rect x="84" y="86" width="132" height="112" rx="16" fill="#7b4cd9"/>
   <rect x="104" y="112" width="92" height="56" rx="7" fill="#FBF6E4"/>
   <circle cx="128" cy="140" r="9" fill="#111"/>
   <circle cx="172" cy="140" r="9" fill="#111"/>
   <path d="M150 86 V58" fill="none"/>
   <circle class="ant" cx="150" cy="48" r="12" fill="#f7a637"/>
  </g>
 </g>
</svg>
<h1>¡Hola, mundo!</h1>
<p>Esta página vive en una microVM de Firecracker con su propio kernel.</p>
<p style="margin-top:1.4em"><span class="tag">EasyBits · flota</span></p>
</div>
